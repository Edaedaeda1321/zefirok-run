name: Cleanup storefront featured branch

on:
  push:
    branches:
      - feat/storefront-featured-control
    paths:
      - .github/workflows/cleanup-storefront-featured.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storefront-featured-control
          fetch-depth: 0
      - name: Cleanup patch artifacts
        run: |
          git fetch origin main
          git checkout origin/main -- assets/images-manifest.json
          rm -f .github/fix_patch_v2.py
          rm -f .github/workflows/cleanup-storefront-featured.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean storefront patch artifacts"
          git push origin HEAD:feat/storefront-featured-control
