name: Apply storefront featured control

on:
  push:
    branches:
      - feat/storefront-featured-control
    paths:
      - .github/workflows/apply-storefront-featured.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storefront-featured-control
          fetch-depth: 0
      - name: Fix encoded matcher
        run: python3 .github/fix_patch_v2.py
      - name: Apply patch
        run: python3 .github/patch_storefront_featured_v2.py
      - name: Validate
        run: |
          node --check src/worker.js
          node scripts/check-assets.mjs --news-manifest
          node scripts/check-assets.mjs --new-only
          grep -q 'shopFeaturedSave' owner.html
          grep -q 'remoteShopFeatured' index.html
          grep -q 'ownerPanelSaveShopFeatured' src/worker.js
          test -f migrations/0068_shop_featured.sql
      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make shop featured slots configurable"
          git push origin HEAD:feat/storefront-featured-control
