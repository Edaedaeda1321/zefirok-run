<!doctype html>
<html lang="ru">
<head>
 <base href="./world/" />
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
 <meta name="theme-color" content="#fff5f8" />
 <meta name="robots" content="noindex,nofollow" />
 <title>Мир Зеффи — Общий город</title>
 <link rel="stylesheet" href="./story/style.css?v=9" />
 <script id="zeffi-story-embedded-safearea">try{if(window.parent!==window||window.Telegram?.WebApp)document.documentElement.classList.add('zeffi-story-embedded');}catch(_){}</script>
</head>
<body>
 <main class="access-screen" id="accessGate" aria-live="polite">
  <img src="../assets/mir_zeffi/icon_Mir_zeffi_world_stranitca.webp" alt="Мир Зеффи" width="108" height="108" />
  <span class="eyebrow">МИР ЗЕФФИ · ОБЩИЙ ГОРОД</span>
  <h1 id="accessTitle">Открываем ворота города…</h1>
  <p id="accessMessage">Проверяем доступ и загружаем общий город.</p>
  <progress id="loadProgress" max="100" value="0" aria-label="Загрузка карты"></progress>
  <button id="accessRetry" class="primary" type="button" hidden>Повторить</button>
  <a class="quiet-link" href="../">Вернуться в Сладкий Забег</a>
 </main>
 <main id="storyShell" class="story-shell" hidden>
  <header class="story-header">
   <button id="returnWorld" class="round-button back" type="button" aria-label="Вернуться в Сладкий Забег"></button>
   <img class="brand-image" src="../assets/mir_zeffi/icon_Mir_zeffi_world_stranitca.webp" alt="" width="42" height="42" />
   <div class="brand-copy"><span class="eyebrow">МИР ЗЕФФИ</span><h1>Общий город</h1></div>
   <button id="openPersonalCity" class="city-switch" type="button" aria-label="Открыть мой район">Мой район <span aria-hidden="true">↗</span></button>
   <button id="modeBadge" class="tester-menu-button" type="button" aria-label="Инструменты разработки" title="Инструменты разработки" hidden>•••</button>
  </header>
  <section class="map-zone" id="mapZone" aria-label="Сюжетная карта 48 на 48 клеток">
   <canvas id="storyCanvas" tabindex="0" aria-label="Карта: перетаскивайте для перемещения, используйте стрелки на клавиатуре или кнопки районов"></canvas>
   <canvas id="storyOverlay" aria-hidden="true"></canvas>
   <div id="mapMarkers" class="map-markers" aria-label="Места города"></div>
   <div class="sr-only" id="focusTitle" aria-live="polite">Центральная площадь</div>
   <div class="sr-only" id="sceneFacts">48 × 48 · загружаем жителей</div>
   <div class="camera-controls" aria-label="Управление картой">
    <button id="zoomIn" class="round-button" type="button" aria-label="Приблизить"></button>
    <button id="zoomOut" class="round-button" type="button" aria-label="Отдалить"></button>
    <button id="centerMap" class="round-button" type="button" aria-label="Вернуть карту к площади"></button>
    <button id="pauseLife" class="round-button" type="button" aria-label="Приостановить анимацию" aria-pressed="false"></button>
   </div>
   <button id="projectBanner" class="project-banner" type="button" aria-label="Открыть городские стройки">
    <span class="project-banner-symbol" aria-hidden="true"><span data-icon="heart"></span></span>
    <span class="project-banner-copy"><span class="eyebrow" id="fundModeEyebrow">СТРОИМ ВМЕСТЕ</span><strong><span id="bannerTitle">Сад встреч</span><span id="bannerPercent">34%</span></strong><span class="mini-track"><span id="bannerBar"></span></span><small class="sr-only" id="bannerStatus">Прогресс городских строек загружается с сервера</small></span>
    <span class="banner-arrow" aria-hidden="true">›</span>
   </button>
  </section>
  <nav class="bottom-nav" aria-label="Разделы общего мира">
   <button type="button" data-nav="map" aria-current="page"><span data-icon="map"></span><span>Карта</span></button>
   <button type="button" data-nav="buildings"><span data-icon="heart"></span><span>Стройки</span></button>
   <button type="button" data-nav="history"><span data-icon="star"></span><span>История</span></button>
  </nav>
 </main>
 <dialog id="storyPanel" class="story-panel" aria-labelledby="panelTitle"><button id="closePanel" class="round-button panel-close" type="button" aria-label="Закрыть"></button><div id="panelContent"></div></dialog>
 <div id="storyToast" class="toast" role="status" aria-live="polite"></div>
 <script type="module" src="./story/boot.js?v=8"></script>
</body>
</html>
