  function makeCaseReward(type) {
    const state = loadState(true);

    const choice = String(cfg.reward || "auto") === "auto" ? auto : String(cfg.reward || auto);

    else if (choice === "coffee") reward = {kind:"coffee",amount:750};
    else if (choice === "booster_points") reward = {kind:"booster",boosterType:"points"};
    else if (choice === "booster_treats") reward = {kind:"booster",boosterType:"treats"};
    else if (choice === "booster_coffee") reward = {kind:"booster",boosterType:"coffee"};

    else if (choice === "alex_skin") reward = {kind:"skin",id:"alex"};
    else if (choice === "alex_trail") reward = {kind:"trail",id:"alex_trail"};
    else if (choice === "alex_frame") reward = {kind:"frame",id:"alex_frame_1"};
    else if (choice === "alex_avatar") reward = {kind:"avatar",id:"alex_avatar_1"};
    else reward = {kind:"points",amount:100000};
    if (["skin","avatar","frame","trail","music"].includes(reward.kind)) {
      reward.duplicate = Boolean(cfg.duplicate);
      reward.guaranteed = Boolean(cfg.guaranteed);

  function applyReward(reward) {
    const state = loadState(true);
    const p = state.profile;
    if (reward.kind === "points") p.wallet += Math.max(0, Number(reward.amount || 0));
    if (reward.kind === "treats") p.treats += Math.max(0, Number(reward.amount || 0));
    if (reward.kind === "coffee") p.coffee += Math.max(0, Number(reward.amount || 0));
    if (reward.kind === "booster") {
      const type = String(reward.boosterType || "");
      if (Object.prototype.hasOwnProperty.call(state.cases.boosters, type)) state.cases.boosters[type] = Math.max(0, Number(state.cases.boosters[type] || 0)) + 1;
    }
    if (["skin","avatar","frame","trail","music"].includes(reward.kind)) {
      if (reward.duplicate) p.wallet += Math.max(0, Number(reward.compensationPoints || 0));

    saveState(state);

  function openCase(typeInput) {

    saveState(state);

  function legalStatusPayload() {

      documents[key] = {

        acceptedVersion:confirmed ? def.version : String(saved.acceptedVersion || ""), acceptedAt:confirmed ? Number(saved.acceptedAt || 0) : 0,
        revoked:Boolean(saved.revoked), revokedAt:Number(saved.revokedAt || 0), revocationReason:String(saved.revocationReason || ""), revocationSource:String(saved.revocationSource || "")
      };
    }
    const complete = documents.agreement.accepted && documents.privacy.accepted && documents.consent.accepted;
    return { ok:true, localBuild:true, telegramId:String(state.player?.id || "local"), complete, required:!complete, accepted:complete,
      requiredStep:!documents.agreement.accepted ? "agreement" : !documents.privacy.accepted ? "privacy" : !documents.consent.accepted ? "consent" : "",

  function acceptLegalStep(stepInput, languageInput = "ru") {
    const step = String(stepInput || "").trim().toLowerCase();
    if (!["agreement","privacy","consent"].includes(step)) return { ok:false, localBuild:true, error:"Неизвестный этап принятия документов.", code:"LOCAL_LEGAL_BAD_STEP" };
    const state = loadState(true);
    const current = legalStatusPayload();
    if (step === "privacy" && !current.documents.agreement.accepted) return { ok:false, localBuild:true, error:"Сначала примите Лицензионное соглашение.", code:"LOCAL_LEGAL_ORDER" };
    if (step === "consent" && (!current.documents.agreement.accepted || !current.documents.privacy.accepted)) return { ok:false, localBuild:true, error:"Сначала примите Лицензионное соглашение и ознакомьтесь с Политикой конфиденциальности.", code:"LOCAL_LEGAL_ORDER" };
    const language = String(languageInput || "ru").toLowerCase() === "en" ? "en" : "ru";
    const now = localNow();
    const keys = step === "agreement" ? ["agreement","privacy"] : [step];
    for (const key of keys) {
      const def = LEGAL_DEFS[key], row = state.legal.documents[key];
      if (row.accepted && String(row.acceptedVersion || "") === def.version) continue;
      Object.assign(row,{ accepted:true, confirmed:true, version:def.version, acceptedVersion:def.version, acceptedAt:now, revoked:false, revokedAt:0, revocationReason:"", revocationSource:"" });
      state.legal.history.push({ documentKey:key, version:def.version, kind:def.kind, language, acceptedAt:now, localBuild:true });
    }
    state.legal.history = state.legal.history.slice(-60);
    saveState(state);
    return legalStatusPayload();
  }

  function parseBodySync(body) {
    if (body == null) return {};
    if (typeof body === "string") { try { return JSON.parse(body); } catch { return {raw:body}; } }
    if (body instanceof URLSearchParams) return Object.fromEntries(body.entries());
    if (typeof FormData !== "undefined" && body instanceof FormData) {
      const out = {};
      for (const [key,value] of body.entries()) if (typeof value === "string") out[key] = value;
      return out;
    }
    return typeof body === "object" ? body : {};
  }
  async function requestPayload(input, init, method) {
    let body = init?.body;
    if (body == null && input instanceof Request && method !== "GET" && method !== "HEAD") {
      try { body = await input.clone().text(); } catch { body = null; }
    }
    return parseBodySync(body);
  }
  function jsonResponse(data, status = 200) {
    return new Response(JSON.stringify(data), { status, headers:{"Content-Type":"application/json","Cache-Control":"no-store","X-Zefirok-Local-Build":LOCAL_VERSION} });

  function faultFor(path, signal) {
    const fault = loadState(true).faults || {};
    const mode = String(fault.mode || "none");
    const filter = String(fault.path || "").trim();
    if (mode === "none" || (filter && !String(path).includes(filter))) return null;
    if (mode === "500") return Promise.resolve(errorResponse(`LOCAL fault 500 · ${path}`, 500, "LOCAL_FAULT_500"));
    if (mode === "offline") return Promise.reject(Object.assign(new TypeError(`LOCAL offline · ${path}`), {code:"LOCAL_OFFLINE"}));
    if (mode === "timeout") {
      return new Promise((resolve, reject) => {
        if (signal?.aborted) return reject(new DOMException("Aborted", "AbortError"));
        signal?.addEventListener?.("abort", () => reject(new DOMException("Aborted", "AbortError")), {once:true});
      });
    }
    const delayMs = Math.max(0, Number(fault.delayMs || 0));
    if (mode === "delay" && delayMs > 0) return new Promise(resolve => setTimeout(() => resolve(null), delayMs));
    return null;
  }

  async function routeApi(path, payload, query) {
    recordApi(path);
    const state = loadState(true);
    if (path === "/api/access/bootstrap") { const legal=legalStatusPayload(); return { ok:true, allowed:true, maintenance:{maintenance:false,allowed:true,mode:"open"}, legal:{accepted:legal.complete,required:!legal.complete,...legal}, localBuild:true }; }

    if (path === "/api/legal/accept") return acceptLegalStep(payload.step, payload.language);

    if (path === "/api/game/startup") return startupPayload();
    if (path === "/api/profile/sync") {
      if (payload?.mode === "write" && payload?.current && typeof payload.current === "object") {
        for (const field of ["wallet","best","treats","coffee","profileXp"]) if (field in payload.current) state.profile[field] = Math.floor(clampNumber(payload.current[field]));
        saveState(state);
      }
      return {ok:true,localBuild:true,profile:profileData()};
    }
    if (path === "/api/shop/config") return {ok:true,localBuild:true,products:{},assortment:{},liveContent:safeClone(state.shop.liveContent||[])};
    if (path === "/api/skins/config") return {ok:true,localBuild:true,skins:{}};
    if (path === "/api/cases/state") return casePayload();
    if (path === "/api/cases/open-granted") return openCase(payload.caseType);
    if (path === "/api/cases/open") {
      const level = Math.max(2, Math.floor(Number(payload.level || 2)));
      const type = level % 10 === 0 ? "gold" : level % 5 === 0 ? "sweet" : "small";
      if (!state.cases.openedLevels.includes(level)) state.cases.openedLevels.push(level);
      saveState(state);
      return openCase(type);
    }
    if (path === "/api/cases/purchase") {
      const type = CASE_TYPES.includes(String(payload.caseType || "")) ? String(payload.caseType) : "small";
      const costs = { small:[5000,0,0], sweet:[15000,0,0], gold:[30000,0,0], mythic:[50000,25,25], legendary:[75000,50,50], alex:[100000,75,75] }[type];
      state.profile.wallet = Math.max(0, state.profile.wallet - costs[0]);
      state.profile.treats = Math.max(0, state.profile.treats - costs[1]);
      state.profile.coffee = Math.max(0, state.profile.coffee - costs[2]);
      state.cases.inventory[type] = Math.max(0, Number(state.cases.inventory[type] || 0)) + 1;
      saveState(state);
      return casePayload({purchase:{caseType:type,repeated:false}});
    }
    if (path === "/api/cases/activate") {
      const type = String(payload.boosterType || "");
      if (Object.prototype.hasOwnProperty.call(state.cases.boosters,type) && Number(state.cases.boosters[type]||0)>0) {
        state.cases.boosters[type] -= 1; state.cases.activeBooster = {type,runsLeft:2}; saveState(state);
      }
      return casePayload();
    }
    if (path === "/api/cases/equip") {
      const kind = String(payload.kind || ""), id = String(payload.id || "");
      if (kind === "avatar") state.cases.activeAvatarId = id;
      if (kind === "frame") state.cases.activeFrameId = id;
      if (kind === "trail") state.cases.activeTrailId = id;
      if (kind === "music") state.cases.activeMusicTrackId = id || "cafe_run";
      if (kind === "skin") state.cases.activeSkinId = id || "default";
      saveState(state); return casePayload();
    }
    if (path === "/api/cases/consume-run") {
      if (Number(state.cases.activeBooster?.runsLeft||0)>0) state.cases.activeBooster.runsLeft -= 1;
      if (Number(state.cases.activeBooster?.runsLeft||0)<=0) state.cases.activeBooster = {type:"",runsLeft:0};
      saveState(state); return casePayload();
    }
    if (path === "/api/skins/bonus-case") {
      const type = "gold"; state.cases.inventory[type] += 1; saveState(state); return casePayload({bonusCase:{granted:true,caseType:type}});
    }
    if (path === "/api/skins/purchase") {
      const skinId = String(payload.skinId || "default"); if (!state.cases.ownedSkins.includes(skinId)) state.cases.ownedSkins.push(skinId); state.cases.activeSkinId = skinId; saveState(state); return casePayload({skin:{id:skinId,purchased:true}});
    }

    if (path === "/api/gifts/state") return giftStatePayload();
    if (path === "/api/gifts/claim") {
      const gift = state.gifts.items.find(item => String(item.id) === String(payload.giftId));
      if (gift) { gift.status = "claimed"; gift.claimedAt = Math.floor(localNow()/1000); for (const reward of gift.rewards || []) { if (reward.kind === "case" && CASE_TYPES.includes(String(reward.id))) state.cases.inventory[reward.id] += Math.max(1,Number(reward.amount||1)); else applyReward(reward); } }
      saveState(state); return {ok:true,localBuild:true,profile:{ok:true,profile:profileData()},cases:casePayload(),gifts:giftStatePayload()};
    }

    if (path === "/api/rewards/create") {
      const code = `LOCAL-${localNow().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
      const reward = { code, productId:String(payload.productId||"zefir"), productName:"LOCAL награда", issuedAt:localNow(), expiresAt:localNow()+86400000, status:"active" };
      state.rewards.codes.push(reward); state.profile.profileXp += 50; saveState(state);

    if (path === "/api/leaderboard/submit") {
      const score = Math.floor(clampNumber(payload.score || payload.best || 0)); state.leaderboard.seasonBest = Math.max(state.leaderboard.seasonBest, score); state.leaderboard.allTimeBest = Math.max(state.leaderboard.allTimeBest, score); saveState(state); return leaderboardPayload(payload.mode || "season");

(() => {

  function rewardContext(row){
    const sourceKey=String(row?.sourceKey||'');
    if(sourceKey.startsWith('friend_gift:'))return 'Бесплатный подарок от пригласившего друга';
    if(sourceKey.startsWith('weekly:')){const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));if(row?.role==='invitee')return state?.inviter?`Недельный подарок с ${state.inviter.displayName}`:'Совместный недельный подарок';return friend?`Недельный подарок с ${friend.displayName}`:'Совместный недельный подарок';}
    if(row?.sourceType==='network')return 'Награда за количество активных друзей';
    if(sourceKey.startsWith('return:')){const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));return row?.role==='invitee'?'Ты вернулся после перерыва':friend?`${friend.displayName} вернулся после перерыва`:'Друг вернулся после перерыва';}

    const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));
    const milestone=friend?.milestones?.find(item=>String(item.key)===key);
    const stage=milestone?.title||known[key]||'Совместный этап';

mber(w.friendRuns||0)}/${target}.`}</div>${!w.completed&&!w.locked?`<div class="friend-weekly-bars"><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(Number(w.myRuns||0)/target*100))}%"></div></div><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(Number(w.friendRuns||0)/target*100))}%"></div></div></div>`:''}</div>`:''}${friend.status==='active'&&gift.enabled?`<div class="friend-actions"><button class="friend-gift-btn" data-gift="${esc(friend.telegramId)}" ${gift.available?'':'disabled'}>${rewardImageMarkup(gift.reward)}<span>${gift.available?`Подарить · ${esc(gift.rewardLabel)}`:`Следующий подарок через ${esc(giftWait||'позже')}`}</span></button></div>`:''}<div class="milestones">${milestones.map(m=>{const progress=m.progress||{},percent=Math.max(0,Math.min(100,Number(progress.percent||0)));return `<div class="milestone ${m.achieved?'done':''}"><i>${m.achieved?'✓':'○'}</i><strong>${esc(m.title)}</strong><span>${m.achieved?`Выполнено${m.achievedAt?` · ${fmtDate(m.achievedAt)}`:''}`:`${esc(m.description||'')} · Тебе: ${esc(m.inviterRewardLabel)}${m.inviteeReward?.kind&&m.inviteeReward.kind!=='none'?` · Другу: ${esc(m.inviteeRewardLabel)}`:''}`}</span>${!m.achieved?`<div class="milestone-progress-head"><b>${esc(progress.label||'В процессе')}</b><span>${percent}%</span></div><div class="milestone-track"><div class="milestone-fill" style="width:${percent}%"></div></div>`:''}</div>`;}).join('')}</div></article>`;}).join('')}</div>`;

      {title:'Как друг становится активным',text:`После привязки друг проходит стартовый этап — сейчас это ${starterRuns} подтверждённых сервером забега. Потом идут уровни профиля 5, 10 и 20. На карточке друга видно точный прогресс и ближайшую следующую цель.`,note:'Активность до привязки и незачтённые попытки в реферальный прогресс не входят.',visual:`<div class="mini-path"><span>${starterRuns} забега</span><b>›</b><span>5 уровень</span><b>›</b><span>10</span><b>›</b><span>20</span></div>`},
      {title:'Элитный и Элитный+',text:'Если уже привязанный друг активирует Элитный или Элитный+ сезонный пропуск, пригласивший получает дополнительный XP сезонного пропуска в том сезоне, где произошла покупка.',note:'Покупка до реферальной привязки не засчитывается задним числом. XP сезонного пропуска начисляется сервером автоматически.',visual:'<div class="mini-path"><span>Элитный</span><b>→</b><span>+ XP</span><span>Элитный+</span><b>→</b><span>+ XP</span></div>'},

    ];

      steps.push({title:'События и возвращение друзей',text:pieces.join(' '),note:`${boost.enabled?'Множитель применяется только к новым наградам, открытым в период события. ':''}${returnProgram.enabled?'Награда за возвращение выдаётся один раз на каждого активного друга.':''}`.trim(),visual:eventVisual});
    }

    steps.push({title:'«Моё кафе» — большие вехи',text:`Каждый активный друг двигает общую лестницу 1 / 3 / 5 / 10 / 20 / 50. На плитке сразу показано, какая награда ждёт на конкретной цели.${choiceMilestones.length?` На крупных вехах ${choiceThresholds||'10 / 20 / 50'} может открываться выбор из нескольких больших наград.`:''}`,note:choiceMilestones.length?'Если появился большой выбор, можно получить только один вариант. После подтверждения изменить решение нельзя.':'Награда за каждую общую веху выдаётся сервером только один раз.',visual:choiceMilestones.length?`<div class="mini-path"><span>${esc(choiceThresholds||'Большая веха')}</span><b>→</b><span>🎁</span><span>🎁</span><span>🎁</span><b>→</b><span>выбери 1</span></div>`:'<div class="mini-path"><span>1</span><span>3</span><span>5</span><span>10</span><span>20</span><span>50</span></div>'});

    steps.push({title:'Готовые подарки и получение',text:'Обычные награды появляются в блоке «Готовые подарки» — нажми «Забрать» или «Забрать все». Сервер фиксирует выдачу, поэтому один и тот же подарок нельзя получить повторно.',note:'Для совместных и больших наград появляется отдельный экран получения. На крупных вехах можно поделиться достижением. Обучение всегда можно снова открыть кнопкой «?».',visual:'<div class="mini-path"><span>Готовый подарок</span><b>→</b><span>Забрать</span><b>→</b><span>✨ Получено</span></div>'});
    return steps;
  }

  function renderTutorial(){
    if(!tutorialLayer||!tutorialBody)return;const steps=tutorialSteps();tutorialStep=Math.max(0,Math.min(steps.length-1,tutorialStep));const step=steps[tutorialStep];tutorialBody.innerHTML=`<div class="tutorial-progress">Шаг ${tutorialStep+1} из ${steps.length}</div><div class="tutorial-visual">${step.visual}</div><h2 id="ref-tutorial-title">${esc(step.title)}</h2><p>${esc(step.text)}</p><div class="tutorial-note">${esc(step.note)}</div><div class="tutorial-dots">${steps.map((_,i)=>`<span class="tutorial-dot ${i===tutorialStep?'active':''}"></span>`).join('')}</div><div class="tutorial-actions"><button class="tutorial-prev" data-tutorial-prev type="button" ${tutorialStep===0?'disabled':''}>Назад</button><button class="tutorial-next" data-tutorial-next type="button">${tutorialStep===steps.length-1?'Понятно':'Дальше'}</button></div>`;
  }
  function markTutorialSeen(){try{localStorage.setItem(TUTORIAL_KEY,'1');}catch{}try{sessionStorage.setItem(TUTORIAL_KEY,'1');}catch{}try{document.cookie=`${TUTORIAL_KEY}=1; Max-Age=31536000; Path=/; SameSite=Lax`;}catch{}}
  function tutorialWasSeen(){try{if(localStorage.getItem(TUTORIAL_KEY)==='1')return true;}catch{}try{if(sessionStorage.getItem(TUTORIAL_KEY)==='1')return true;}catch{}try{if(document.cookie.split(';').some(row=>row.trim()===`${TUTORIAL_KEY}=1`))return true;}catch{}return false;}
  function openTutorial(automatic=false){if(!tutorialLayer||!state)return;if(choiceLayer&&!choiceLayer.hidden)closeChoice();if(automatic)markTutorialSeen();tutorialStep=0;renderTutorial();lockPageScroll();tutorialLayer.hidden=false;tutorialLayer.setAttribute('aria-hidden','false');if(!automatic)haptic();}
  function closeTutorial(markSeen=true){if(!tutorialLayer)return;tutorialLayer.hidden=true;tutorialLayer.setAttribute('aria-hidden','true');unlockPageScroll();if(markSeen)markTutorialSeen();}
  function maybeOpenTutorial(){if(tutorialWasSeen())return;setTimeout(()=>{if(!tutorialWasSeen())openTutorial(true);},220);}

  function openChoice(threshold){const item=(state?.networkMilestones||[]).find(row=>Number(row.threshold)===Number(threshold));if(!item?.choice?.pending||!choiceLayer||!choiceOptionsEl)return;activeChoiceThreshold=Number(item.threshold);choiceOptionsEl.innerHTML=(item.choice.options||[]).map((reward,index)=>`<button class="choice-option" type="button" data-choice-select="${index}">${rewardImageMarkup(reward)}<strong>${esc(item.choice.optionLabels?.[index]||'Награда')}</strong></button>`).join('');document.querySelector('[data-choice-copy]').textContent=`Веха «${item.title}». Выбери один подарок из ${item.choice.options.length}. После подтверждения изменить выбор нельзя.`;lockPageScroll();choiceLayer.hidden=false;choiceLayer.setAttribute('aria-hidden','false');haptic();}
  function closeChoice(){if(!choiceLayer)return;choiceLayer.hidden=true;choiceLayer.setAttribute('aria-hidden','true');activeChoiceThreshold=0;unlockPageScroll();}

  function openCelebration({title='Подарок получен!',text='',reward=null,threshold=0}={}){if(!celebrationLayer)return;celebrationThreshold=Math.max(0,Number(threshold||0));if(celebrationArt)celebrationArt.innerHTML=reward?rewardImageMarkup(reward):rewardImageMarkup({kind:'none'});if(celebrationTitle)celebrationTitle.textContent=String(title||'Подарок получен!');if(celebrationText)celebrationText.textContent=String(text||'');if(celebrationActions)celebrationActions.classList.toggle('single',!celebrationThreshold);const shareButton=celebrationLayer.querySelector('[data-celebration-share]');if(shareButton)shareButton.hidden=!celebrationThreshold;lockPageScroll();celebrationLayer.hidden=false;celebrationLayer.setAttribute('aria-hidden','false');haptic('medium');}
  function closeCelebration(){if(!celebrationLayer)return;celebrationLayer.hidden=true;celebrationLayer.setAttribute('aria-hidden','true');celebrationThreshold=0;unlockPageScroll();}
  async function shareMilestone(thresholdValue){const threshold=Math.max(1,Number(thresholdValue||0)),link=inviteLink();const text=`Моё кафе в «Сладком Забеге» уже собрало ${threshold} активных друзей 💗 Заходи к нам!`;haptic();try{if(navigator.share){await navigator.share({title:'Друзья кафе · Сладкий Забег',text,url:link||undefined});return;}}catch(error){if(error?.name==='AbortError')return;}const share=`https://t.me/share/url?url=${encodeURIComponent(link||location.href)}&text=${encodeURIComponent(text)}`;try{webApp?.openTelegramLink?.(share);return;}catch{}try{await navigator.clipboard.writeText(`${text}${link?`
${link}`:''}`);showToast('Текст достижения скопирован');}catch{location.href=share;}}
  async function toggleNotifications(){const n=state?.notifications;if(!n?.available||busy)return;busy=true;const button=document.querySelector('[data-notification-toggle]');if(button)button.disabled=true;try{const data=await api('/api/referrals/notifications/save',{enabled:!n.enabled});state.notifications=data.notifications;render();haptic('medium');showToast(state.notifications.enabled?'Уведомления друзей включены':'Уведомления друзей выключены');}catch(error){showToast(error.message||'Не удалось изменить уведомления');if(button)button.disabled=false;}finally{busy=false;}}
  async function selectChoice(index){if(busy||!activeChoiceThreshold)return;const item=(state?.networkMilestones||[]).find(row=>Number(row.threshold)===Number(activeChoiceThreshold));const label=item?.choice?.optionLabels?.[index]||'эту награду';if(!confirm(`Выбрать «${label}»?\n\nПосле подтверждения изменить выбор нельзя.`))return;busy=true;choiceOptionsEl?.querySelectorAll('button').forEach(button=>button.disabled=true);try{const data=await api('/api/referrals/choice/select',{threshold:activeChoiceThreshold,index});state=data.state;closeChoice();haptic('medium');showToast(`Выбрано: ${data.selected?.selectedRewardLabel||label}`);render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}}catch(error){showToast(error.message||'Не удалось выбрать награду');choiceOptionsEl?.querySelectorAll('button').forEach(button=>button.disabled=false);}finally{busy=false;}}

  function render(){
    if(!state)return;
    const next=state.nextNetworkMilestone;
    const programOff=state.program?.enabled===false;
    const readyRewardCount=(state.rewards||[]).filter(row=>['pending','failed'].includes(String(row.status))).length;
    root.innerHTML=`
      <section class="hero">
        <div class="kicker">Сладкий Забег · вместе веселее</div>
        <h2>Собирай друзей в кафе</h2>
        <p>Друг играет и развивается — вы получаете совместные подарки. Отправляй друзьям бесплатные подарки, открывайте недельную коробку и следи за событиями в общей ленте.</p>
        <div class="hero-stats"><div class="stat"><small>Активные друзья</small><strong>${esc(state.activeFriends||0)}</strong></div><div class="stat"><small>${next?'До следующего подарка':'Лестница пройдена'}</small><strong>${next?`${esc(next.remaining)} друг${Number(next.remaining)===1?'':'а'}`:'✓'}</strong></div></div>
        <div class="invite"><button class="primary" data-invite ${programOff?'disabled':''}>${programOff?'Приглашения временно выключены':'Пригласить друга'}</button><div class="invite-code"><span class="invite-code-label">Твой код<small>встроен в ссылку</small></span><code>${esc(state.self?.code||'—')}</code><button class="secondary" style="min-height:32px;padding:0 10px;font-size:8.5px" data-copy>Копировать ссылку</button></div></div>
      </section>
      ${state.program?.boost?.active?`<div class="boost-banner"><b>×${esc(state.program.boost.multiplier||2)}</b><div><strong>${esc(state.program.boost.title||'Реферальный праздник')}</strong><span>Все новые реферальные награды, открытые сейчас, умножаются сервером${state.program.boost.endsAt?` · до ${fmtDate(state.program.boost.endsAt)}`:''}.</span></div></div>`:''}
      ${renderNotificationCard()}
      ${state.inviter?`<section class="section"><div class="head"><div><h3>Кто пригласил тебя</h3><p>Ваш совместный путь уже связан сервером.</p></div></div><div class="inviter"><div class="avatar">${esc(initials(state.inviter.displayName))}</div><div class="friend-name"><strong>${esc(state.inviter.displayName)}</strong><span>${state.inviter.status==='active'?'Вы уже активировали совместные награды':'Заверши стартовый этап, чтобы активировать дружбу'}</span>${inviterWeeklyMarkup()}</div></div></section>`:''}
      <section class="section"><div class="head"><div><h3>Лента друзей</h3><p>Что происходит у твоей компании прямо сейчас.</p></div></div>${renderFeed()}</section>
      <section class="section"><div class="head"><div><h3>Недельный подарок</h3><p>Одна общая коробка за активность тебя и друга.</p></div></div>${renderWeeklySection()}</section>
      <section class="section"><div class="head"><div><h3>Моё кафе</h3><p>Большие подарки за количество активных друзей.</p></div><span class="badge">${esc(state.activeFriends||0)} активных</span></div>${renderNetwork()}</section>
      ${renderPendingChoices()}
      <section class="section"><div class="head"><div><h3>Готовые подарки</h3><p>Каждая награда выдаётся сервером только один раз.</p></div>${readyRewardCount>1?'<button class="claim-all" data-claim-all>Забрать все</button>':''}</div>${renderRewards()}</section>
      ${renderRewardHistory()}
      <section class="section"><div class="head"><div><h3>Твои друзья</h3><p>Следи за этапами, недельным прогрессом и отправляй бесплатный подарок.</p></div><span class="badge">${esc(state.totalInvited||0)} всего</span></div>${renderFriends()}</section>
      <div class="notice">Друг считается активным после стартового этапа. Привязка работает только для нового игрока, который впервые запустил игру по твоему Telegram-приглашению; один аккаунт нельзя привязать к нескольким пригласившим.${state.program?.returnProgram?.enabled?` Если активный друг вернётся после ${esc(state.program.returnProgram.afterDays||14)} дней без зачтённых забегов, сервер один раз откроет дополнительный совместный подарок.`:''}</div>`;
  }

  async function load(){
    initData=readInitData();if(!initData){root.innerHTML='<div class="empty" style="margin-top:30px">Открой «Сладкий Забег» внутри Telegram, чтобы загрузить реферальную систему.</div>';return;}
    try{state=await api('/api/referrals/state');render();maybeOpenTutorial();}catch(error){root.innerHTML=`<div class="empty" style="margin-top:30px">${esc(error.message||'Не удалось загрузить страницу.')}<br><br><button class="secondary" data-retry>Повторить</button></div>`;}
  }

  async function shareInvite(){
    const link=inviteLink();if(!link)return;haptic();
    const text='Заходи в «Сладкий Забег» — будем получать совместные подарки в «Друзьях кафе» ☕🎁';
    try{
      if(navigator.share){await navigator.share({title:'Сладкий Забег',text,url:link});return;}
    }catch(error){if(error?.name==='AbortError')return;}
    const share=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
    try{webApp?.openTelegramLink?.(share);return;}catch{}
    try{await navigator.clipboard.writeText(link);showToast('Ссылка скопирована');}catch{location.href=share;}
  }

  async function copyInvite(){const link=inviteLink();if(!link)return;try{await navigator.clipboard.writeText(link);haptic();showToast('Ссылка приглашения скопирована');}catch{showToast(`Код: ${state.self?.code||''}`);}}
  async function sendGift(recipientId){if(busy)return;const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(recipientId));if(!friend)return;const gift=state?.friendGift||{};if(!gift.available){showToast(gift.nextGiftAt?`Следующий подарок через ${timeLeft(gift.nextGiftAt)}`:'Подарок сейчас недоступен');return;}if(!confirm(`Отправить ${friend.displayName} бесплатный подарок?\n\n${gift.rewardLabel}\nПосле отправки начнётся перерыв ${gift.cooldownHours} ч.`))return;busy=true;document.querySelectorAll('[data-gift]').forEach(button=>button.disabled=true);try{const data=await api('/api/referrals/gift/send',{recipientTelegramId:recipientId});state=data.state;haptic('medium');showToast(`Подарок отправлен · ${data.gift?.rewardLabel||gift.rewardLabel}`);render();}catch(error){showToast(error.message||'Не удалось отправить подарок');document.querySelectorAll('[data-gift]').forEach(button=>button.disabled=false);}finally{busy=false;}}
  async function claim(id){if(busy)return;const before=(state?.rewards||[]).find(row=>String(row.id)===String(id));busy=true;const button=[...document.querySelectorAll('[data-claim]')].find(node=>node.dataset.claim===String(id));if(button)button.disabled=true;try{const data=await api('/api/referrals/claim',{rewardId:id});state=data.state;render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}const key=String(before?.sourceKey||''),social=key.startsWith('weekly:')||key.startsWith('friend_gift:')||key.startsWith('return:')||before?.sourceType==='network';if(social){const threshold=before?.sourceType==='network'?Math.max(0,Number(key.split(':')[1]||0)):0;openCelebration({title:key.startsWith('weekly:')?'Совместный подарок получен!':key.startsWith('friend_gift:')?'Подарок от друга получен!':before?.sourceType==='network'?'Большая награда получена!':'Совместный подарок получен!',text:`${before?.rewardLabel||'Награда'} добавлена в твой аккаунт.`,reward:data.reward||before?.reward,threshold});}else{haptic('medium');showToast('Подарок получен 🎁');}}catch(error){showToast(error.message||'Не удалось получить подарок');if(button)button.disabled=false;}finally{busy=false;}}
  async function claimAll(){if(busy)return;busy=true;document.querySelector('[data-claim-all]')?.setAttribute('disabled','');try{const data=await api('/api/referrals/claim-all');state=data.state;haptic('medium');showToast(data.delivered?`Получено наград: ${data.delivered}`:'Новых наград нет');render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}}catch(error){showToast(error.message||'Не удалось получить награды');}finally{busy=false;}}

  document.addEventListener('click',(event)=>{if(event.target.closest('[data-tutorial-open]')){openTutorial(false);return;}if(event.target.closest('[data-tutorial-close]')){closeTutorial(true);return;}if(event.target.closest('[data-tutorial-prev]')){tutorialStep=Math.max(0,tutorialStep-1);renderTutorial();haptic();return;}if(event.target.closest('[data-tutorial-next]')){const steps=tutorialSteps();if(tutorialStep>=steps.length-1){closeTutorial(true);haptic('medium');}else{tutorialStep+=1;renderTutorial();haptic();}return;}if(event.target.closest('[data-celebration-close]')){closeCelebration();return;}if(event.target.closest('[data-celebration-share]')){shareMilestone(celebrationThreshold);return;}if(event.target.closest('[data-notification-toggle]')){toggleNotifications();return;}const shareMilestoneButton=event.target.closest('[data-share-milestone]');if(shareMilestoneButton){shareMilestone(shareMilestoneButton.dataset.shareMilestone);return;}if(event.target.closest('[data-choice-close]')){closeChoice();return;}const choiceOpen=event.target.closest('[data-choice-open]');if(choiceOpen){openChoice(choiceOpen.dataset.choiceOpen);return;}const choiceSelect=event.target.closest('[data-choice-select]');if(choiceSelect){selectChoice(Number(choiceSelect.dataset.choiceSelect));return;}const giftButton=event.target.closest('[data-gift]');if(giftButton){sendGift(giftButton.dataset.gift);return;}const invite=event.target.closest('[data-invite]');if(invite){shareInvite();return;}const copy=event.target.closest('[data-copy]');if(copy){copyInvite();return;}const claimButton=event.target.closest('[data-claim]');if(claimButton){claim(claimButton.dataset.claim);return;}if(event.target.closest('[data-claim-all]')){claimAll();return;}if(event.target.closest('[data-retry]')){root.innerHTML='<div class="loading"><div><div class="spinner"></div>Загружаем…</div></div>';load();return;}});
  const close=()=>{if(celebrationLayer&&!celebrationLayer.hidden){closeCelebration();return;}if(tutorialLayer&&!tutorialLayer.hidden){closeTutorial(true);return;}if(choiceLayer&&!choiceLayer.hidden){closeChoice();return;}try{window.parent.postMessage({type:'zefirok-close-referrals'},'*');if(window.parent!==window)return;}catch{}history.length>1?history.back():location.assign('/?screen=profile');};
  try{webApp?.ready?.();webApp?.expand?.();webApp?.disableVerticalSwipes?.();webApp?.BackButton?.onClick?.(close);webApp?.BackButton?.show?.();}catch{}
  window.addEventListener('message',(event)=>{if(event.data?.type==='zefirok-host-viewport-changed'){try{document.documentElement.style.setProperty('--app-height',`${Number(event.data.payload?.height||0)}px`);}catch{}}});
  load();
})();
</script>
</body>
</html>
