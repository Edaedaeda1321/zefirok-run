ons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.celebration-actions button{min-height:43px;border-radius:14px;font-size:10px;font-weight:950}.celebration-done{border:0;background:linear-gradient(180deg,#ed8db1,#d9618f);color:#fff}.celebration-share{border:1px solid rgba(205,103,139,.22);background:#fff;color:#a65373}.celebration-actions.single{grid-template-columns:1fr}.tutorial{touch-action:none}.tutorial-card{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.modal-scroll-locked{overscroll-behavior:none!important}

<body>
  <main class="app">
    <header class="topbar"><span></span><h1>Друзья кафе</h1><button class="helpbtn" data-tutorial-open type="button" aria-label="Как работают Друзья кафе">?</button></header>
    <div data-root><div class="loading"><div><div class="spinner"></div>Загружаем друзей и награды…</div></div></div>
  </main>
  <div class="toast" data-toast></div>
  <div class="tutorial" data-tutorial hidden aria-hidden="true"><div class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="ref-tutorial-title"><button class="tutorial-close" data-tutorial-close type="button">Закрыть</button><div data-tutorial-body></div></div></div>
  <div class="choice-overlay" data-choice hidden aria-hidden="true"><div class="choice-sheet" role="dialog" aria-modal="true" aria-labelledby="ref-choice-title"><h2 id="ref-choice-title">Выбери большую награду</h2><p data-choice-copy>Выбери один подарок. После подтверждения изменить выбор нельзя.</p><div class="choice-options" data-choice-options></div><button class="choice-close" data-choice-close type="button">Закрыть</button></div></div>
  <div class="celebration-overlay" data-celebration hidden aria-hidden="true"><div class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="ref-celebration-title"><div class="celebration-kicker">Друзья кафе · подарок</div><div class="celebration-art" data-celebration-art></div><h2 id="ref-celebration-title" data-celebration-title>Подарок получен!</h2><p data-celebration-text></p><div class="celebration-actions" data-celebration-actions><button class="celebration-share" data-celebration-share type="button">Поделиться</button><button class="celebration-done" data-celebration-close type="button">Готово</button></div></div></div>
<script>
(() => {
  const BOT_USERNAME = "zefirok_obn_bot";
  const root = document.querySelector('[data-root]');
  const toast = document.querySelector('[data-toast]');
  const webApp = window.Telegram?.WebApp;
  let state = null;
  let initData = "";
  let busy = false;
  let tutorialStep = 0;
  const TUTORIAL_KEY = "zefirok-referrals-tutorial-v4";
  const tutorialLayer = document.querySelector("[data-tutorial]");
  const tutorialBody = document.querySelector("[data-tutorial-body]");
  const choiceLayer = document.querySelector("[data-choice]");
  const choiceOptionsEl = document.querySelector("[data-choice-options]");
  const celebrationLayer = document.querySelector("[data-celebration]");
  const celebrationArt = document.querySelector("[data-celebration-art]");
  const celebrationTitle = document.querySelector("[data-celebration-title]");
  const celebrationText = document.querySelector("[data-celebration-text]");
  const celebrationActions = document.querySelector("[data-celebration-actions]");
  let celebrationThreshold = 0;
  let activeChoiceThreshold = 0;
  let lockedScrollY = 0;
  let scrollLocked = false;

  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const fmtDate = (unix) => unix ? new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(Number(unix)*1000)) : '';
  const initials = (name) => (String(name||'Д').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('') || 'Д').toUpperCase();
  const REWARD_IMAGES = Object.freeze({
    case:Object.freeze({small:"/assets/cases/standart_closed.png",sweet:"/assets/cases/Bronze_close.png",gold:"/assets/cases/gold_closed.png",mythic:"/assets/cases/Mifik_case_closed.png",legendary:"/assets/cases/legendary_closed.png"}),
    booster:Object.freeze({points:"/assets/cases/boosters/1F00010C-F984-4A41-B8B6-8E5CD7DF637A.PNG",treats:"/assets/cases/boosters/80C21DC3-04A8-46F7-B8E4-9AC8FE13CCEB.PNG",coffee:"/assets/cases/boosters/11FDBEBF-D838-4DA5-AA57-9DE0E4BA26AE.PNG"}),
    points:"/assets/shop/currency_star_256x256.png",zefir:"/assets/season-pass/zefir_currency.png",coffee:"/assets/optimized/v0.79.5/iconCoffee.png",season_pass_xp:"/assets/season-pass/xp_x2.png",fallback:"/assets/ui/icon_referals.png"
  });
  const rewardImage = (reward) => { const kind=String(reward?.kind||''); if(kind==='case')return REWARD_IMAGES.case[String(reward?.id||'small')]||REWARD_IMAGES.fallback;if(kind==='booster')return REWARD_IMAGES.booster[String(reward?.id||'points')]||REWARD_IMAGES.fallback;return REWARD_IMAGES[kind]||REWARD_IMAGES.fallback; };
  const rewardImageMarkup = (reward,cls='') => `<img class="${esc(cls)}" src="${esc(rewardImage(reward))}" alt="" loading="lazy" decoding="async">`;
  const showToast = (text) => { toast.textContent=String(text||'');toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400); };
  const haptic = (value='light') => { try { webApp?.HapticFeedback?.impactOccurred?.(value); } catch {} };
  const feedIcon = (type) => ({join:'👋',active:'☕',milestone:'⭐',return:'↩',gift:'🎁',weekly:'🤝',network:'🏆',choice:'👑'})[String(type||'')] || '•';
  const timeLeft = (unix) => { const sec=Math.max(0,Number(unix||0)-Math.floor(Date.now()/1000));if(!sec)return '';const hours=Math.ceil(sec/3600);if(hours<24)return `${hours} ч.`;return `${Math.ceil(hours/24)} дн.`; };
  function syncPageScrollLock(){const shouldLock=scrollLockReasons.size>0;if(shouldLock===scrollLocked)return;if(shouldLock){scrollLocked=true;lockedScrollY=window.scrollY||document.documentElement.scrollTop||0;document.documentElement.classList.add('modal-scroll-locked');document.documentElement.style.overflow='hidden';document.body.style.position='fixed';document.body.style.top=`-${lockedScrollY}px`;document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%';document.body.style.overflow='hidden';return;}scrollLocked=false;document.documentElement.classList.remove('modal-scroll-locked');document.documentElement.style.overflow='';document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';document.body.style.width='';document.body.style.overflow='';window.scrollTo(0,lockedScrollY);}
  function lockPageScroll(reason='global'){scrollLockReasons.add(String(reason||'global'));syncPageScrollLock();}
  function unlockPageScroll(reason='global'){scrollLockReasons.delete(String(reason||'global'));syncPageScrollLock();}

  function readInitData(){
    let value='';try{value=String(webApp?.initData||'');}catch{}
    if(!value){try{const hash=new URLSearchParams(location.hash.replace(/^#/,''));value=String(hash.get('tgInitData')||'');}catch{}}
    if(!value){try{value=String(sessionStorage.getItem('zefirok-telegram-init-data')||'');}catch{}}
    if(value){try{sessionStorage.setItem('zefirok-telegram-init-data',value);}catch{}}
    return value;
  }

  async function api(path,body={}){
    const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,...body}),cache:'no-store'});
    let data=null;try{data=await response.json();}catch{}
    if(!response.ok||!data?.ok)throw new Error(data?.error||`Ошибка ${response.status}`);
    return data;
  }

  function inviteLink(){return state?.self?.code?`https://t.me/${BOT_USERNAME}?startapp=ref_${encodeURIComponent(state.self.code)}`:'';}

  function renderNetwork(){
    const items=state?.networkMilestones||[];if(!items.length)return '<div class="empty">Лестница наград пока не настроена.</div>';
    const active=Number(state.activeFriends||0);let nextMarked=false;
    return `<div class="network">${items.map(item=>{const threshold=Number(item.threshold);const next=!item.achieved&&!nextMarked&&threshold>active;if(next)nextMarked=true;const choice=item.choice?.enabled?item.choice:null;const waiting=Boolean(choice?.pending),selected=Boolean(choice?.selected),done=item.achieved&&(!choice||selected);const art=choice?(selected&&choice.selectedReward?`<div class="network-reward-art">${rewardImageMarkup(choice.selectedReward)}</div>`:`<div class="choice-preview">${(choice.options||[]).map(r=>rewardImageMarkup(r)).join('')}</div>`):`<div class="network-reward-art">${rewardImageMarkup(item.reward)}</div>`;const label=choice?(selected?choice.selectedRewardLabel:`Выбор из ${(choice.options||[]).length} наград`):item.rewardLabel;const specialLabel=threshold===3?'Командный подарок':threshold===20?'Большой выбор':'';const specialClass=threshold===20?' choice':'';return `<div class="network-card ${done?'done':next?'next':''} ${specialLabel?'featured':''}">${specialLabel?`<div class="network-special${specialClass}">${esc(specialLabel)}</div>`:''}<div class="network-top"><div class="network-num">${done?'✓':esc(item.threshold)}</div><span class="network-state">${waiting?'Выбери':done?'Получено':next?'Следующая':'Цель'}</span></div>${art}<strong>${esc(item.title)}</strong><span class="reward-label">${esc(label)}</span>${waiting?`<button class="network-choice-btn" data-choice-open="${esc(item.threshold)}">Выбрать подарок</button>`:''}${item.achieved&&threshold>=10?`<button class="network-share-btn" data-share-milestone="${esc(item.threshold)}">Поделиться вехой</button>`:''}</div>`;}).join('')}</div>`;
  }

  function rewardContext(row){
    const sourceKey=String(row?.sourceKey||'');
    if(sourceKey.startsWith('friend_gift:'))return 'Бесплатный подарок от пригласившего друга';
    if(sourceKey.startsWith('weekly:')){const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));if(row?.role==='invitee')return state?.inviter?`Недельный подарок с ${state.inviter.displayName}`:'Совместный недельный подарок';return friend?`Недельный подарок с ${friend.displayName}`:'Совместный недельный подарок';}
    if(row?.sourceType==='network')return 'Награда за количество активных друзей';
    if(sourceKey.startsWith('return:')){const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));return row?.role==='invitee'?'Ты вернулся после перерыва':friend?`${friend.displayName} вернулся после перерыва`:'Друг вернулся после перерыва';}
    const key=sourceKey.split(':').slice(2).join(':');
    const known={starter:'Стартовый этап',level_5:'5 уровень',level_10:'10 уровень',elite:'Элитный',elite_plus:'Элитный+',level_20:'20 уровень'};
    const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));
    const milestone=friend?.milestones?.find(item=>String(item.key)===key);
    const stage=milestone?.title||known[key]||'Совместный этап';
    if(row?.role==='invitee')return `Твой этап · ${stage}`;
    return friend?`${friend.displayName} · ${stage}`:`Друг · ${stage}`;
  }

  function renderRewards(){
    const rows=(state?.rewards||[]).filter(r=>r.status!=='delivered');
    if(!rows.length)return '<div class="empty">Новых подарков пока нет. Когда друг достигнет следующего этапа, награда появится здесь.</div>';
    return `<div class="reward-list">${rows.map(row=>`<div class="reward"><div class="reward-icon">${rewardImageMarkup(row.reward)}</div><div class="reward-copy"><strong>${esc(row.rewardLabel)}</strong><span>${esc(rewardContext(row))}${row.status==='failed'?' · можно повторить получение':''}</span></div><button class="claim" data-claim="${esc(row.id)}">Забрать</button></div>`).join('')}</div>`;
  }

  function renderRewardHistory(){
    const rows=(state?.rewards||[]).filter(r=>r.status==='delivered').slice(0,6);
    if(!rows.length)return '';
    return `<section class="section"><div class="head"><div><h3>Последние награды</h3><p>Здесь виден и XP, который начисляется автоматически за Элитный / Элитный+ друга.</p></div></div><div class="reward-list">${rows.map(row=>`<div class="reward"><div class="reward-icon">${rewardImageMarkup(row.reward)}</div><div class="reward-copy"><strong>${esc(row.rewardLabel)}</strong><span>${esc(rewardContext(row))}${row.deliveredAt?` · ${fmtDate(row.deliveredAt)}`:''}</span></div><span class="friend-status active">Получено</span></div>`).join('')}</div></section>`;
  }

  function renderNotificationCard(){
    const n=state?.notifications;if(!n?.available)return '';
    return `<div class="notification-card"><div><strong>Telegram-уведомления друзей</strong><span>${n.enabled?`Включены · не больше ${esc(n.dailyCap||2)} важных сообщений в день.`:'Выключены. Включи, если хочешь узнавать о подарках и важных этапах, даже когда игра закрыта.'}</span></div><button class="notification-toggle ${n.enabled?'on':''}" data-notification-toggle type="button">${n.enabled?'Включены':'Включить'}</button></div>`;
  }

  function renderFeed(){
    const rows=state?.feed||[];if(!rows.length)return '<div class="empty">Лента оживёт, когда друзья начнут присоединяться, проходить этапы и обмениваться подарками.</div>';
    return `<div class="feed-list">${rows.slice(0,12).map(item=>`<div class="feed-item"><div class="feed-icon">${feedIcon(item.type)}</div><div class="feed-copy"><strong>${esc(item.title)}</strong><span>${esc(item.text||'')}</span></div><span class="feed-date">${fmtDate(item.at)}</span></div>`).join('')}</div>`;
  }

  function renderWeeklySection(){
    const w=state?.weeklyProgram;if(!w?.enabled)return '<div class="empty">Совместный недельный подарок сейчас выключен.</div>';
    const partner=(state?.friends||[]).find(friend=>String(friend.telegramId)===String(w.partnerId||''));
    const activeFriends=(state?.friends||[]).filter(friend=>friend.status==='active');
    const best=activeFriends.slice().sort((a,b)=>Number(b.weekly?.friendRuns||0)-Number(a.weekly?.friendRuns||0))[0];
    const target=Math.max(1,Number(w.target||3)),friendRuns=w.completed?Number(partner?.weekly?.friendRuns||target):Number(best?.weekly?.friendRuns||0),friendName=w.completed?(partner?.displayName||'друг'):(best?.displayName||'активный друг');
    return `<div class="weekly-card"><div class="weekly-title"><strong>Недельная коробка</strong><span>${w.completed?'Открыта ✓':`до ${fmtDate(w.endsAt)}`}</span></div><div class="weekly-copy">${w.completed?`Вы открыли подарок вместе с ${esc(friendName)}. Новый прогресс начнётся в следующий понедельник.`:`Сделай ${target} подтверждённых забега за неделю. Когда любой активный друг тоже сделает ${target}, коробка откроется вам обоим. За неделю у пригласившего открывается только одна коробка.`}</div><div class="weekly-pair"><div class="weekly-person"><b>Ты · ${Math.min(target,Number(w.myRuns||0))}/${target}</b><span>подтверждённых забегов</span><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(Number(w.myRuns||0)/target*100))}%"></div></div></div><div class="weekly-person"><b>${esc(friendName)} · ${Math.min(target,friendRuns)}/${target}</b><span>${activeFriends.length?'лучший прогресс друга':'нужен активный друг'}</span><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(friendRuns/target*100))}%"></div></div></div></div><div class="weekly-rewards">${rewardImageMarkup(w.referrerReward)}<span>Тебе: ${esc(w.referrerRewardLabel)}</span>${rewardImageMarkup(w.inviteeReward)}<span>Другу: ${esc(w.inviteeRewardLabel)}</span></div></div>`;
  }

  function renderPendingChoices(){
    const rows=state?.pendingChoices||[];if(!rows.length)return '';
    const first=rows[0];return `<section class="section"><div class="choice-callout"><strong>👑 Большая награда готова</strong><span>Ты достиг вехи «${esc(first.title)}». Выбери один из ${(first.choice?.options||[]).length} подарков — после подтверждения изменить выбор нельзя.${rows.length>1?` Ещё выборов: ${rows.length-1}.`:''}</span><button type="button" data-choice-open="${esc(first.threshold)}">Выбрать награду</button></div></section>`;
  }

  function inviterWeeklyMarkup(){const w=state?.inviter?.weekly;if(!w?.enabled)return '';const target=Math.max(1,Number(w.target||3));return `<div class="friend-weekly ${w.completed?'done':w.locked?'locked':''}" style="margin:10px 0 0"><div class="friend-weekly-head"><span>🤝 Недельный подарок</span><span>${w.completed?'Готов ✓':w.locked?'Уже открыт':'Эта неделя'}</span></div><div class="friend-weekly-copy">${w.completed?`Вы оба выполнили ${target} забега — награды уже открыты.`:w.locked?'Пригласивший уже открыл недельную коробку с другим активным другом. Новый шанс — на следующей неделе.':`Ты ${Math.min(target,Number(w.myRuns||0))}/${target} · ${esc(state.inviter.displayName)} ${Math.min(target,Number(w.friendRuns||0))}/${target}.`}</div></div>`;}

  function renderFriends(){
    const friends=state?.friends||[];if(!friends.length)return '<div class="empty">Пока здесь никого нет. Отправь приглашение другу — его прогресс появится после первого запуска игры по твоей ссылке.</div>';
    const gift=state?.friendGift||{};const giftWait=gift.available?'':timeLeft(gift.nextGiftAt);

mber(w.friendRuns||0)}/${target}.`}</div>${!w.completed&&!w.locked?`<div class="friend-weekly-bars"><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(Number(w.myRuns||0)/target*100))}%"></div></div><div class="weekly-track"><div class="weekly-fill" style="width:${Math.min(100,Math.round(Number(w.friendRuns||0)/target*100))}%"></div></div></div>`:''}</div>`:''}${friend.status==='active'&&gift.enabled?`<div class="friend-actions"><button class="friend-gift-btn" data-gift="${esc(friend.telegramId)}" ${gift.available?'':'disabled'}>${rewardImageMarkup(gift.reward)}<span>${gift.available?`Подарить · ${esc(gift.rewardLabel)}`:`Следующий подарок через ${esc(giftWait||'позже')}`}</span></button></div>`:''}<div class="milestones">${milestones.map(m=>{const progress=m.progress||{},percent=Math.max(0,Math.min(100,Number(progress.percent||0)));return `<div class="milestone ${m.achieved?'done':''}"><i>${m.achieved?'✓':'○'}</i><strong>${esc(m.title)}</strong><span>${m.achieved?`Выполнено${m.achievedAt?` · ${fmtDate(m.achievedAt)}`:''}`:`${esc(m.description||'')} · Тебе: ${esc(m.inviterRewardLabel)}${m.inviteeReward?.kind&&m.inviteeReward.kind!=='none'?` · Другу: ${esc(m.inviteeRewardLabel)}`:''}`}</span>${!m.achieved?`<div class="milestone-progress-head"><b>${esc(progress.label||'В процессе')}</b><span>${percent}%</span></div><div class="milestone-track"><div class="milestone-fill" style="width:${percent}%"></div></div>`:''}</div>`;}).join('')}</div></article>`;}).join('')}</div>`;

  function tutorialSteps(){

      {title:'Кого система засчитает',text:`Рефералом становится новый игрок, который открыл игру по твоей ссылке в течение ${hours} ч. после появления аккаунта.${maxRuns===0?' До привязки у него не должно быть ни одного зачтённого забега.':` До привязки допускается не больше ${maxRuns} зачтённых забегов.`}`,note:'Старый аккаунт нельзя привязать задним числом. Самоприглашение, повторная привязка и связь одного игрока с несколькими пригласившими блокируются сервером.',visual:'<div class="mini-path"><span>Новый игрок</span><b>+</b><span>Твоя ссылка</span><b>→</b><span>Привязан ✓</span></div>'},
      {title:'Как друг становится активным',text:`После привязки друг проходит стартовый этап — сейчас это ${starterRuns} подтверждённых сервером забега. Потом идут уровни профиля 5, 10 и 20. На карточке друга видно точный прогресс и ближайшую следующую цель.`,note:'Активность до привязки и незачтённые попытки в реферальный прогресс не входят.',visual:`<div class="mini-path"><span>${starterRuns} забега</span><b>›</b><span>5 уровень</span><b>›</b><span>10</span><b>›</b><span>20</span></div>`},
      {title:'Элитный и Элитный+',text:'Если уже привязанный друг активирует Элитный или Элитный+ сезонный пропуск, пригласивший получает дополнительный XP сезонного пропуска в том сезоне, где произошла покупка.',note:'Покупка до реферальной привязки не засчитывается задним числом. XP сезонного пропуска начисляется сервером автоматически.',visual:'<div class="mini-path"><span>Элитный</span><b>→</b><span>+ XP</span><span>Элитный+</span><b>→</b><span>+ XP</span></div>'},
      {title:'Лента друзей и уведомления',text:`Лента показывает важные события вашей компании: кто присоединился, стал активным, достиг этапа, вернулся или открыл совместный подарок. ${notifications.available?'Telegram-уведомления о важных событиях можно включить отдельно.':'Telegram-уведомления для рефералов сейчас отключены в настройках игры.'}`,note:notifications.available?`Уведомления добровольные и выключены у игрока по умолчанию. После включения сервер отправляет не больше ${dailyCap} важных сообщений в день.`:'Когда уведомления будут доступны, включать их или нет всё равно решает сам игрок.',visual:'<div class="mini-path"><span>Лента</span><b>+</b><span>Этапы</span><b>→</b><span>Telegram 🔔</span></div>'}
    ];

    if(gift.enabled){
      steps.push({title:'Бесплатный подарок другу',text:`Активному приглашённому другу можно бесплатно отправить системный подарок «${String(gift.rewardLabel||'подарок')}». Он не списывается из твоего баланса. После отправки действует общий перерыв ${giftCooldown} ч.`,note:'Подарок можно отправлять только своему активному приглашённому другу. Сервер не позволит выдать два подарка одновременно или обойти cooldown.',visual:'<div class="mini-path"><span>Активный друг</span><b>→</b><span>🎁 бесплатно</span><b>→</b><span>Cooldown</span></div>'});

    if(boost.enabled||returnProgram.enabled){

    }

    steps.push({title:'«Моё кафе» — большие вехи',text:`Каждый активный друг двигает общую лестницу 1 / 3 / 5 / 10 / 20 / 50. На плитке сразу показано, какая награда ждёт на конкретной цели.${choiceMilestones.length?` На крупных вехах ${choiceThresholds||'10 / 20 / 50'} может открываться выбор из нескольких больших наград.`:''}`,note:choiceMilestones.length?'Если появился большой выбор, можно получить только один вариант. После подтверждения изменить решение нельзя.':'Награда за каждую общую веху выдаётся сервером только один раз.',visual:choiceMilestones.length?`<div class="mini-path"><span>${esc(choiceThresholds||'Большая веха')}</span><b>→</b><span>🎁</span><span>🎁</span><span>🎁</span><b>→</b><span>выбери 1</span></div>`:'<div class="mini-path"><span>1</span><span>3</span><span>5</span><span>10</span><span>20</span><span>50</span></div>'});

  function renderTutorial(){

  }
  function markTutorialSeen(){try{localStorage.setItem(TUTORIAL_KEY,'1');}catch{}try{sessionStorage.setItem(TUTORIAL_KEY,'1');}catch{}try{document.cookie=`${TUTORIAL_KEY}=1; Max-Age=31536000; Path=/; SameSite=Lax`;}catch{}}

  function openTutorial(automatic=false){if(!tutorialLayer||!state)return;if(choiceLayer&&!choiceLayer.hidden)closeChoice();if(automatic)markTutorialSeen();tutorialStep=0;renderTutorial();lockPageScroll('tutorial');tutorialLayer.hidden=false;tutorialLayer.setAttribute('aria-hidden','false');if(!automatic)haptic();}

  function openChoice(threshold){const item=(state?.networkMilestones||[]).find(row=>Number(row.threshold)===Number(threshold));if(!item?.choice?.pending||!choiceLayer||!choiceOptionsEl)return;activeChoiceThreshold=Number(item.threshold);choiceOptionsEl.innerHTML=(item.choice.options||[]).map((reward,index)=>`<button class="choice-option" type="button" data-choice-select="${index}">${rewardImageMarkup(reward)}<strong>${esc(item.choice.optionLabels?.[index]||'Награда')}</strong></button>`).join('');document.querySelector('[data-choice-copy]').textContent=`Веха «${item.title}». Выбери один подарок из ${item.choice.options.length}. После подтверждения изменить выбор нельзя.`;lockPageScroll('choice');choiceLayer.hidden=false;choiceLayer.setAttribute('aria-hidden','false');haptic();}

  async function shareMilestone(thresholdValue){const threshold=Math.max(1,Number(thresholdValue||0)),link=inviteLink();const text=`Моё кафе в «Сладком Забеге» уже собрало ${threshold} активных друзей 💗 Заходи к нам!`;haptic();try{if(navigator.share){await navigator.share({title:'Друзья кафе · Сладкий Забег',text,url:link||undefined});return;}}catch(error){if(error?.name==='AbortError')return;}const share=`https://t.me/share/url?url=${encodeURIComponent(link||location.href)}&text=${encodeURIComponent(text)}`;try{webApp?.openTelegramLink?.(share);return;}catch{}try{await navigator.clipboard.writeText(`${text}${link?`
${link}`:''}`);showToast('Текст достижения скопирован');}catch{location.href=share;}}
  async function toggleNotifications(){const n=state?.notifications;if(!n?.available||busy)return;busy=true;const button=document.querySelector('[data-notification-toggle]');if(button)button.disabled=true;try{const data=await api('/api/referrals/notifications/save',{enabled:!n.enabled});state.notifications=data.notifications;render();haptic('medium');showToast(state.notifications.enabled?'Уведомления друзей включены':'Уведомления друзей выключены');}catch(error){showToast(error.message||'Не удалось изменить уведомления');if(button)button.disabled=false;}finally{busy=false;}}

      ${state.inviter?`<section class="section"><div class="head"><div><h3>Кто пригласил тебя</h3><p>Ваш совместный путь уже связан сервером.</p></div></div><div class="inviter"><div class="avatar">${esc(initials(state.inviter.displayName))}</div><div class="friend-name"><strong>${esc(state.inviter.displayName)}</strong><span>${state.inviter.status==='active'?'Вы уже активировали совместные награды':'Заверши стартовый этап, чтобы активировать дружбу'}</span>${inviterWeeklyMarkup()}</div></div></section>`:''}
      <section class="section"><div class="head"><div><h3>Лента друзей</h3><p>Что происходит у твоей компании прямо сейчас.</p></div></div>${renderFeed()}</section>
      <section class="section"><div class="head"><div><h3>Недельный подарок</h3><p>Одна общая коробка за активность тебя и друга.</p></div></div>${renderWeeklySection()}</section>
      <section class="section"><div class="head"><div><h3>Моё кафе</h3><p>Большие подарки за количество активных друзей.</p></div><span class="badge">${esc(state.activeFriends||0)} активных</span></div>${renderNetwork()}</section>
      ${renderPendingChoices()}
      <section class="section"><div class="head"><div><h3>Готовые подарки</h3><p>Каждая награда выдаётся сервером только один раз.</p></div>${readyRewardCount>1?'<button class="claim-all" data-claim-all>Забрать все</button>':''}</div>${renderRewards()}</section>
      ${renderRewardHistory()}
      <section class="section"><div class="head"><div><h3>Твои друзья</h3><p>Следи за этапами, недельным прогрессом и отправляй бесплатный подарок.</p></div><span class="badge">${esc(state.totalInvited||0)} всего</span></div>${renderFriends()}</section>
      <div class="notice">Друг считается активным после стартового этапа. Привязка работает только для нового игрока, который впервые запустил игру по твоему Telegram-приглашению; один аккаунт нельзя привязать к нескольким пригласившим.${state.program?.returnProgram?.enabled?` Если активный друг вернётся после ${esc(state.program.returnProgram.afterDays||14)} дней без зачтённых забегов, сервер один раз откроет дополнительный совместный подарок.`:''}</div>`;
  }

  async function load(){
    initData=readInitData();if(!initData){root.innerHTML='<div class="empty" style="margin-top:30px">Открой «Сладкий Забег» внутри Telegram, чтобы загрузить реферальную систему.</div>';return;}
    try{state=await api('/api/referrals/state');render();maybeOpenTutorial();}catch(error){root.innerHTML=`<div class="empty" style="margin-top:30px">${esc(error.message||'Не удалось загрузить страницу.')}<br><br><button class="secondary" data-retry>Повторить</button></div>`;}
  }

  async function shareInvite(){
    const link=inviteLink();if(!link)return;haptic();
    const text='Заходи в «Сладкий Забег» — будем получать совместные подарки в «Друзьях кафе» ☕🎁';
    try{
      if(navigator.share){await navigator.share({title:'Сладкий Забег',text,url:link});return;}
    }catch(error){if(error?.name==='AbortError')return;}
    const share=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
    try{webApp?.openTelegramLink?.(share);return;}catch{}
    try{await navigator.clipboard.writeText(link);showToast('Ссылка скопирована');}catch{location.href=share;}
  }

  async function copyInvite(){const link=inviteLink();if(!link)return;try{await navigator.clipboard.writeText(link);haptic();showToast('Ссылка приглашения скопирована');}catch{showToast(`Код: ${state.self?.code||''}`);}}
  async function sendGift(recipientId){if(busy)return;const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(recipientId));if(!friend)return;const gift=state?.friendGift||{};if(!gift.available){showToast(gift.nextGiftAt?`Следующий подарок через ${timeLeft(gift.nextGiftAt)}`:'Подарок сейчас недоступен');return;}if(!confirm(`Отправить ${friend.displayName} бесплатный подарок?\n\n${gift.rewardLabel}\nПосле отправки начнётся перерыв ${gift.cooldownHours} ч.`))return;busy=true;document.querySelectorAll('[data-gift]').forEach(button=>button.disabled=true);try{const data=await api('/api/referrals/gift/send',{recipientTelegramId:recipientId});state=data.state;haptic('medium');showToast(`Подарок отправлен · ${data.gift?.rewardLabel||gift.rewardLabel}`);render();}catch(error){showToast(error.message||'Не удалось отправить подарок');document.querySelectorAll('[data-gift]').forEach(button=>button.disabled=false);}finally{busy=false;}}
  async function claim(id){if(busy)return;const before=(state?.rewards||[]).find(row=>String(row.id)===String(id));busy=true;const button=[...document.querySelectorAll('[data-claim]')].find(node=>node.dataset.claim===String(id));if(button)button.disabled=true;try{const data=await api('/api/referrals/claim',{rewardId:id});state=data.state;render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}const key=String(before?.sourceKey||''),social=key.startsWith('weekly:')||key.startsWith('friend_gift:')||key.startsWith('return:')||before?.sourceType==='network';if(social){const threshold=before?.sourceType==='network'?Math.max(0,Number(key.split(':')[1]||0)):0;openCelebration({title:key.startsWith('weekly:')?'Совместный подарок получен!':key.startsWith('friend_gift:')?'Подарок от друга получен!':before?.sourceType==='network'?'Большая награда получена!':'Совместный подарок получен!',text:`${before?.rewardLabel||'Награда'} добавлена в твой аккаунт.`,reward:data.reward||before?.reward,threshold});}else{haptic('medium');showToast('Подарок получен 🎁');}}catch(error){showToast(error.message||'Не удалось получить подарок');if(button)button.disabled=false;}finally{busy=false;}}
  async function claimAll(){if(busy)return;busy=true;document.querySelector('[data-claim-all]')?.setAttribute('disabled','');try{const data=await api('/api/referrals/claim-all');state=data.state;haptic('medium');showToast(data.delivered?`Получено наград: ${data.delivered}`:'Новых наград нет');render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}}catch(error){showToast(error.message||'Не удалось получить награды');}finally{busy=false;}}

  document.addEventListener('click',(event)=>{if(event.target.closest('[data-tutorial-open]')){openTutorial(false);return;}if(event.target.closest('[data-tutorial-close]')){closeTutorial(true);return;}if(event.target.closest('[data-tutorial-prev]')){tutorialStep=Math.max(0,tutorialStep-1);renderTutorial();haptic();return;}if(event.target.closest('[data-tutorial-next]')){const steps=tutorialSteps();if(tutorialStep>=steps.length-1){closeTutorial(true);haptic('medium');}else{tutorialStep+=1;renderTutorial();haptic();}return;}if(event.target.closest('[data-celebration-close]')){closeCelebration();return;}if(event.target.closest('[data-celebration-share]')){shareMilestone(celebrationThreshold);return;}if(event.target.closest('[data-notification-toggle]')){toggleNotifications();return;}const shareMilestoneButton=event.target.closest('[data-share-milestone]');if(shareMilestoneButton){shareMilestone(shareMilestoneButton.dataset.shareMilestone);return;}if(event.target.closest('[data-choice-close]')){closeChoice();return;}const choiceOpen=event.target.closest('[data-choice-open]');if(choiceOpen){openChoice(choiceOpen.dataset.choiceOpen);return;}const choiceSelect=event.target.closest('[data-choice-select]');if(choiceSelect){selectChoice(Number(choiceSelect.dataset.choiceSelect));return;}const giftButton=event.target.closest('[data-gift]');if(giftButton){sendGift(giftButton.dataset.gift);return;}const invite=event.target.closest('[data-invite]');if(invite){shareInvite();return;}const copy=event.target.closest('[data-copy]');if(copy){copyInvite();return;}const claimButton=event.target.closest('[data-claim]');if(claimButton){claim(claimButton.dataset.claim);return;}if(event.target.closest('[data-claim-all]')){claimAll();return;}if(event.target.closest('[data-retry]')){root.innerHTML='<div class="loading"><div><div class="spinner"></div>Загружаем…</div></div>';load();return;}});
  const close=()=>{if(celebrationLayer&&!celebrationLayer.hidden){closeCelebration();return;}if(tutorialLayer&&!tutorialLayer.hidden){closeTutorial(true);return;}if(choiceLayer&&!choiceLayer.hidden){closeChoice();return;}try{window.parent.postMessage({type:'zefirok-close-referrals'},'*');if(window.parent!==window)return;}catch{}history.length>1?history.back():location.assign('/?screen=profile');};
  try{webApp?.ready?.();webApp?.expand?.();webApp?.disableVerticalSwipes?.();webApp?.BackButton?.onClick?.(close);webApp?.BackButton?.show?.();}catch{}
  window.addEventListener('message',(event)=>{if(event.data?.type==='zefirok-host-viewport-changed'){try{document.documentElement.style.setProperty('--app-height',`${Number(event.data.payload?.height||0)}px`);}catch{}}});
  load();
})();
</script>
</body>
</html>
