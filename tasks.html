<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Задания — Сладкий Забег</title>
  <style>
    :root{color-scheme:light only}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff8fb 0%,#fff2f6 100%);color:#6b4050}
    .card{width:min(100%,420px);padding:22px 18px;border:1px solid rgba(226,170,190,.72);border-radius:24px;background:#fff;box-shadow:0 18px 44px rgba(121,63,86,.12);text-align:center}
    .icon{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#ffeaf2);box-shadow:inset 0 0 0 1px rgba(224,143,174,.18)}
    .icon img{width:54px;height:54px;object-fit:contain}
    h1{margin:0 0 8px;font-size:24px;line-height:1.1}
    p{margin:0;color:#8f6b79;line-height:1.45}
    .note{margin-top:14px;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><img src="/assets/ui/icon_quest_game.webp" alt=""></div>
    <h1>Открываем задания…</h1>
    <p>Раздел заданий теперь открывается прямо внутри игры.</p>
    <p class="note">Если переход не сработал автоматически, открой «Сладкий Забег» ещё раз.</p>
  </div>
  <script>
    (()=>{
      const target=new URL('/index.html',location.origin);
      target.searchParams.set('screen','tasks');
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
