<script data-zefirok-image-fallback>
(()=>{
  const FALLBACK="/assets/ui/error404-no-icon.webp";
  if(window.__ZEFIROK_IMAGE_FALLBACK_V1__)return;
  window.__ZEFIROK_IMAGE_FALLBACK_V1__=true;
  window.ZEFIROK_IMAGE_FALLBACK=FALLBACK;
  const bad=value=>/^(?:|undefined|null|false|nan|\[object object\])$/i.test(String(value??"").trim());
  const sameFallback=value=>{try{return new URL(String(value||""),document.baseURI).pathname===FALLBACK}catch{return String(value||"")===FALLBACK}};
  const replace=(img,reason,failed)=>{
    if(!(img instanceof HTMLImageElement))return;
    const current=String(img.currentSrc||img.getAttribute("src")||img.src||"");
    if(sameFallback(current))return;
    img.dataset.zefirokImageError=reason||"load-error";
    img.dataset.zefirokFailedSrc=String(failed||current||"").slice(0,1000);
    img.onerror=null;
    img.removeAttribute("srcset");
    img.src=FALLBACK;
  };
  const inspect=img=>{
    if(!(img instanceof HTMLImageElement)||!img.hasAttribute("src"))return;
    const raw=String(img.getAttribute("src")||"").trim();
    if(bad(raw)){replace(img,"invalid-src",raw);return;}
    if(!sameFallback(raw)&&img.complete&&img.naturalWidth===0)replace(img,"load-error",raw);
  };
  document.addEventListener("error",event=>{
    const img=event.target;
    if(!(img instanceof HTMLImageElement))return;
    if(sameFallback(img.currentSrc||img.src||img.getAttribute("src")))return;
    event.preventDefault?.();
    event.stopImmediatePropagation?.();
    replace(img,"load-error",img.currentSrc||img.src||img.getAttribute("src")||"");
  },true);
  const scan=root=>{
    if(root instanceof HTMLImageElement)inspect(root);
    root?.querySelectorAll?.("img").forEach(inspect);
  };
  const boot=()=>{
    scan(document);
    new MutationObserver(records=>{for(const record of records){if(record.type==="attributes")inspect(record.target);else record.addedNodes.forEach(scan);}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["src","srcset"]});
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else queueMicrotask(boot);
  window.zefirokImageSrc=value=>bad(value)?FALLBACK:String(value).trim();
})();
</script>

  const initials = (name) => (String(name||'Д').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('') || 'Д').toUpperCase();
  const REWARD_IMAGES = Object.freeze({

  });
  const rewardImage = (reward) => { const kind=String(reward?.kind||''); if(kind==='case')return REWARD_IMAGES.case[String(reward?.id||'small')]||REWARD_IMAGES.fallback;if(kind==='booster')return REWARD_IMAGES.booster[String(reward?.id||'points')]||REWARD_IMAGES.fallback;return REWARD_IMAGES[kind]||REWARD_IMAGES.fallback; };

  function lockPageScroll(){if(scrollLocked)return;scrollLocked=true;document.querySelector('main')?.setAttribute('inert','');lockedScrollY=window.scrollY||document.documentElement.scrollTop||0;document.documentElement.classList.add('modal-scroll-locked');document.documentElement.style.overflow='hidden';document.body.style.position='fixed';document.body.style.top=`-${lockedScrollY}px`;document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%';document.body.style.overflow='hidden';}

  // Same interaction as rating mini-profiles: drag the grip/header at any scroll
  // position, or pull non-interactive content down only when it starts at the top.
  // This controller changes presentation only; dismiss uses the existing lifecycle.
  function bindModalSwipe(layer,selector,dismiss){
    const panel=layer?.querySelector(selector),handle=panel?.querySelector('[data-sheet-drag]');
    if(!panel||!handle)return null;
    const easing='cubic-bezier(.32,.72,0,1)';
    let gesture=null,frame=0,timer=0,serial=0,closing=false,animations=[];

    const transform=y=>`translate3d(0,${Math.round(y)}px,0)`;
    const backdrop=progress=>`rgba(67,43,54,${(.38*(1-progress)).toFixed(4)})`;
    const progress=(offset,height)=>Math.min(.46,Math.max(0,offset/Math.max(180,height)*1.22));
    // Unlike the rating profile, some of these sheets are very short.
    const threshold=height=>Math.max(100,Math.min(330,height*.50));
    const touchById=(list,id)=>Array.from(list||[]).find(touch=>touch.identifier===id);
    const dragArea=target=>target instanceof Element&&!!target.closest('[data-sheet-drag],.sheet-header');
    const interactive=target=>target instanceof Element&&!target.closest('[data-sheet-drag]')&&!!target.closest('button,a,input,textarea,select,summary,[role="button"],[contenteditable]:not([contenteditable="false"])');
    function nestedScroller(target){
      for(let node=target instanceof Element?target:null;node&&node!==panel;node=node.parentElement){
        const css=getComputedStyle(node);
        if(/auto|scroll/.test(css.overflowY)&&node.scrollHeight>node.clientHeight+2)return true;
        if(/auto|scroll/.test(css.overflowX)&&node.scrollWidth>node.clientWidth+2)return true;
      }
      return false;
    }
    function stopMotion(){
      ++serial;clearTimeout(timer);timer=0;
      cancelAnimationFrame(frame);frame=0;
      for(const animation of animations)try{animation.cancel();}catch{}
      animations=[];
    }
    function releaseGesture(){
      const previous=gesture;gesture=null;
      if(previous?.kind==='pointer')try{panel.releasePointerCapture(previous.id);}catch{}
      panel.classList.remove('sheet-swipe-dragging');
      handle.classList.remove('is-dragging','is-armed');
    }
    function reset(){
      stopMotion();releaseGesture();closing=false;
      layer.classList.remove('sheet-swipe-closing');
      panel.style.transform='';panel.style.transition='';panel.style.willChange='';
      layer.style.backgroundColor='';layer.style.transition='';layer.style.willChange='';

  async function reconcileAfterError(error){

  function celebrateReward(before,reward){

  async function claim(id){
    const before=rewardRows().find(row=>String(row.id)===String(id));
    if(!before||!['pending','failed'].includes(before.status)||!beginAction(`claim:${id}`))return;
    try{
      const data=await api('/api/referrals/claim',{rewardId:id});
      applyState(data);notifyAccount();
      if(data.delivered===true||rewardRows().some(row=>row.id===id&&row.status==='delivered'))celebrateReward(before,data.reward);

    }catch(error){
      const synced=await reconcileAfterError(error);

      else{
        showToast(synced?'Состояние проверено. Подтверждённого получения пока нет.':error.message||'Не удалось проверить выдачу. Обнови состояние перед повтором.');

    if(!event.target.matches('[data-friends-search]'))return;
    ui.query=String(event.target.value||'');
    const list=document.querySelector('[data-friends-list]');if(list)list.innerHTML=renderFriendsList();
  });
  document.addEventListener('keydown',event=>{
    const modal=activeModal();
    if(event.key==='Escape'&&modal){event.preventDefault();close();return;}
    if(event.key==='Tab'&&modal){
      const nodes=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled),summary,[tabindex="0"]')].filter(node=>node.getClientRects().length);
      if(!nodes.length){event.preventDefault();return;}
      const first=nodes[0],last=nodes[nodes.length-1];
      if(event.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){event.preventDefault();first.focus();}
    }
    if(event.target.matches('[role="tab"][data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
      const keys=Object.keys(tabLabels),index=keys.indexOf(ui.tab);
      const next=event.key==='Home'?0:event.key==='End'?keys.length-1:(index+(event.key==='ArrowLeft'?-1:1)+keys.length)%keys.length;
      event.preventDefault();switchTab(keys[next]);
    }
  });
  try{
    webApp?.ready?.();webApp?.expand?.();webApp?.disableVerticalSwipes?.();
    if(window.parent===window){webApp?.BackButton?.onClick?.(close);webApp?.BackButton?.show?.();}
    syncTelegramContentSafeTop();
    for(const name of ['viewportChanged','safeAreaChanged','contentSafeAreaChanged'])try{webApp?.onEvent?.(name,syncTelegramContentSafeTop);}catch{}
  }catch{}
  window.addEventListener('message',event=>{
    if(event.source!==window.parent)return;
    if(event.data?.type==='zefirok-referrals-back'){close();return;}
    if(event.data?.type!=='zefirok-host-viewport-changed')return;
    try{
      const payload=event.data.payload||{};
      document.documentElement.style.setProperty('--app-height',`${n(payload.height)}px`);
      const contentTop=Math.max(0,n(payload?.contentSafeArea?.top)),safeTop=Math.max(0,n(payload?.safeArea?.top));
      if(contentTop||safeTop)setTelegramContentSafeTop(contentTop||safeTop,contentTop?'content':'safe');
    }catch{}
  });
  // Bind once to the persistent shells, never to re-rendered reward/friend rows.
  friendsTutorialDeck = createTutorialDeck(tutorialLayer,tutorialBody,{
    onStep:index=>{tutorialStep=index;renderTutorial();},
    onDismiss:()=>closeTutorial(true),
    onFinish:()=>{closeTutorial(true);switchTab('gifts');},
    isActive:()=>activeModal()===tutorialLayer
  },ZGT_WORDS);
  for(const [layer,selector,dismiss] of [
    [sheetLayer,'.sheet',()=>closeSheet()],
    [choiceLayer,'.choice-sheet',()=>closeChoice()],
    [celebrationLayer,'.celebration-card',()=>closeCelebration()]
  ]){
    const controller=bindModalSwipe(layer,selector,dismiss);
    if(controller)modalSwipeControllers.set(layer,controller);
  }
  document.addEventListener('click',event=>{
    // A drag must never turn into a click on a reward or on the page underneath.
    if((event.detail!==0&&performance.now()<modalSwipeClickUntil)||activeModal()?.classList.contains('sheet-swipe-closing')){
      event.preventDefault();event.stopImmediatePropagation();
    }
  },true);
  const allowNewModalTap=()=>{modalSwipeClickUntil=0;};
  document.addEventListener('pointerdown',allowNewModalTap,true);
  document.addEventListener('touchstart',allowNewModalTap,{capture:true,passive:true});
  // Ready means back handling is installed, not that network data has loaded.
  if(window.parent!==window)window.parent.postMessage({type:'zefirok-referrals-ready'},'*');
  load();

})();
</script>
