<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff7f1">
  <title>Друзья кафе · Сладкий Забег</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#fff7f1;--card:#fff;--ink:#583947;--muted:#90737d;--pink:#dd6d98;--pink2:#ef9ab8;--cream:#fff0cf;--gold:#d69a37;--line:rgba(151,96,112,.16);--ok:#62a978;--shadow:0 16px 40px rgba(112,72,82,.11);font-family:"Sofia Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#583947;background:#fff7f1}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}body{padding:0 0 max(30px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}.app{width:min(680px,100%);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 28px}.topbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:8px 0 12px;background:linear-gradient(180deg,var(--bg) 76%,rgba(255,247,241,0))}.helpbtn{grid-column:3;width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(112,72,82,.08);font-size:18px;color:#9b5871;font-weight:1000}.topbar h1{grid-column:2;margin:0;text-align:center;font-size:18px;font-weight:950}.hero{position:relative;overflow:hidden;padding:22px;border:1px solid rgba(217,119,148,.2);border-radius:28px;background:linear-gradient(145deg,#ffeaf0 0%,#fff8de 86%);box-shadow:var(--shadow)}.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg, rgba(255,239,244,.96) 0%, rgba(255,245,236,.92) 44%, rgba(255,248,224,.78) 72%, rgba(255,248,224,.62) 100%), url("/assets/ui/background_referals.png");background-repeat:no-repeat,no-repeat;background-position:left top, right center;background-size:100% 100%, cover;pointer-events:none}.kicker{position:relative;z-index:1;font-size:10px;font-weight:950;letter-spacing:.12em;color:#c25d84;text-transform:uppercase}.hero h2{position:relative;z-index:1;max-width:450px;margin:6px 0 5px;font-size:27px;line-height:1.05;font-weight:1000}.hero p{position:relative;z-index:1;max-width:440px;margin:0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.45}.hero-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:17px}.stat{padding:12px;border-radius:17px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9)}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}.stat strong{display:block;margin-top:3px;font-size:21px;font-weight:1000}.invite{position:relative;z-index:1;display:grid;gap:9px;margin-top:14px}.primary,.secondary,.claim{border:0;border-radius:17px;min-height:50px;padding:0 16px;font:950 14px/1 inherit;cursor:pointer}.primary{background:linear-gradient(180deg,#ed8db1,#d9618f);color:white;box-shadow:0 10px 20px rgba(198,75,119,.22)}.secondary{background:white;color:#8c5368;border:1px solid rgba(207,105,139,.22)}button:disabled{opacity:.55;cursor:wait}.invite-code{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.68);color:#8d6976;font-size:11px;font-weight:800}.invite-code code{font:950 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a95375;letter-spacing:.07em}.section{margin-top:18px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 3px 10px}.head div{min-width:0}.head h3{margin:0;font-size:17px;font-weight:1000}.head p{margin:3px 0 0;color:var(--muted);font-size:10px;font-weight:700;line-height:1.4}.badge{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#ffe8f0;color:#bd5a80;font-size:10px;font-weight:950}.network{display:grid;grid-auto-flow:column;grid-auto-columns:178px;gap:11px;overflow-x:auto;padding:3px 2px 10px;scroll-snap-type:x mandatory}.network::-webkit-scrollbar{display:none}.network-card{position:relative;scroll-snap-align:start;min-height:210px;padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 10px 24px rgba(112,72,82,.08);display:flex;flex-direction:column}.network-card.done{background:linear-gradient(145deg,#f0fff3,#fff);border-color:rgba(91,160,110,.28)}.network-card.next{background:linear-gradient(145deg,#fff6d8,#fff);border-color:rgba(210,154,54,.35)}.network-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.network-num{display:grid;place-items:center;min-width:36px;height:36px;padding:0 9px;border-radius:12px;background:#fff0f5;color:#ba557c;font-size:14px;font-weight:1000}.network-card.done .network-num{background:#e8f8ec;color:#4b9360}.network-state{font-size:9px;font-weight:950;color:#bb6483}.network-card.done .network-state{color:#4b9360}.network-reward-art{height:92px;margin:9px 0 6px;display:grid;place-items:center}.network-reward-art img{max-width:106px;max-height:88px;object-fit:contain;filter:drop-shadow(0 7px 10px rgba(107,68,75,.10))}.network-card strong{display:block;margin-top:auto;font-size:12px;font-weight:1000;line-height:1.18}.network-card span.reward-label{display:block;margin-top:5px;color:var(--muted);font-size:9px;font-weight:800;line-height:1.3}.reward-list,.friend-list{display:grid;gap:10px}.reward{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 8px 22px rgba(112,72,82,.07)}.reward-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#fff8e9;overflow:hidden}.reward-icon img{width:46px;height:46px;object-fit:contain}.reward-copy{min-width:0}.reward-copy strong{display:block;font-size:12px;font-weight:950}.reward-copy span{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:750;line-height:1.35}.claim{min-height:38px;border-radius:13px;background:#e6759f;color:#fff;padding:0 12px;font-size:10px}.claim-all{min-height:38px;padding:0 12px;border:1px solid rgba(205,103,139,.22);border-radius:13px;background:#fff;color:#a65373;font-size:10px;font-weight:950}.friend{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 9px 24px rgba(112,72,82,.07)}.friend-main{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px}.avatar{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#ffe7ef,#fff4d7);font-size:21px;font-weight:950;color:#a44e70}.friend-name strong{display:block;font-size:13px;font-weight:1000}.friend-name span{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:800}.friend-status{padding:6px 8px;border-radius:999px;background:#fff0f5;color:#b65a7c;font-size:9px;font-weight:950}.friend-status.active{background:#eaf8ee;color:#47885a}.milestones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 12px 13px}.milestone{position:relative;padding:10px;border-radius:14px;background:#faf6f5;border:1px solid rgba(141,101,112,.09);min-height:68px}.milestone.done{background:#f1fbf3}.milestone i{position:absolute;right:8px;top:8px;font-style:normal;font-size:11px}.milestone strong{display:block;padding-right:18px;font-size:10px;font-weight:950}.milestone span{display:block;margin-top:4px;color:var(--muted);font-size:8px;font-weight:700;line-height:1.3}.inviter{display:flex;align-items:center;gap:10px;padding:13px;border-radius:18px;background:#fff;border:1px solid var(--line)}.inviter .avatar{width:38px;height:38px}.empty{padding:18px;border:1px dashed rgba(182,98,127,.28);border-radius:18px;text-align:center;background:rgba(255,255,255,.56);color:var(--muted);font-size:11px;font-weight:750;line-height:1.5}.notice{margin-top:12px;padding:11px 13px;border-radius:15px;background:#fff4d9;color:#82643b;font-size:10px;font-weight:750;line-height:1.45}.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,16px);width:min(360px,calc(100% - 28px));padding:12px 14px;border-radius:15px;background:#5f4350;color:#fff;font-size:11px;font-weight:850;text-align:center;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{display:grid;place-items:center;min-height:58vh;color:var(--muted);font-size:12px;font-weight:850}.spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #f3d8e2;border-top-color:#d86290;border-radius:50%;animation:spin .8s linear infinite}.tutorial[hidden]{display:none}.tutorial{position:fixed;inset:0;z-index:80;background:rgba(69,42,53,.45);backdrop-filter:blur(8px);display:grid;align-items:end;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.tutorial-card{width:min(520px,100%);max-height:min(720px,88vh);overflow:auto;margin:0 auto;padding:18px;border-radius:27px;background:#fffaf6;border:1px solid rgba(202,113,142,.22);box-shadow:0 24px 70px rgba(73,39,51,.26)}.tutorial-progress{font-size:9px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#c45e84}.tutorial-visual{height:150px;display:grid;place-items:center;margin:8px 0 4px;border-radius:20px;background:linear-gradient(145deg,#ffedf3,#fff8dc);overflow:hidden}.tutorial-visual img{max-width:145px;max-height:135px;object-fit:contain}.tutorial-visual .mini-path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px}.tutorial-visual .mini-path span{padding:10px 12px;border-radius:13px;background:#fff;color:#704657;font-size:10px;font-weight:950;box-shadow:0 5px 13px rgba(100,62,75,.08)}.tutorial-card h2{margin:8px 0 6px;font-size:20px;line-height:1.1}.tutorial-card p{margin:0;color:var(--muted);font-size:11px;font-weight:750;line-height:1.55}.tutorial-note{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fff1d8;color:#7c6139;font-size:9px;font-weight:800;line-height:1.45}.tutorial-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.tutorial-actions button{min-height:44px;border-radius:14px;border:1px solid rgba(204,105,130,.2);font:950 11px/1 inherit}.tutorial-prev{background:#fff;color:#966176}.tutorial-next{background:linear-gradient(180deg,#ed8db1,#d9618f);color:#fff}.tutorial-actions button:disabled{opacity:.4}.tutorial-close{float:right;border:0;background:transparent;color:#9e6c7e;font-size:11px;font-weight:900;padding:2px 0 6px}.tutorial-dots{display:flex;gap:5px;justify-content:center;margin-top:12px}.tutorial-dot{width:6px;height:6px;border-radius:999px;background:#ead4dc}.tutorial-dot.active{width:18px;background:#df719b}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.hero{padding:18px}.hero h2{font-size:24px}.milestones{grid-template-columns:1fr}.reward{grid-template-columns:46px minmax(0,1fr)}.reward .claim{grid-column:1/-1}.hero-stats{grid-template-columns:1fr 1fr}.network{grid-auto-columns:164px}.network-card{min-height:198px}.network-reward-art{height:82px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><span></span><h1>Друзья кафе</h1><button class="helpbtn" data-tutorial-open type="button" aria-label="Как работают Друзья кафе">?</button></header>
    <div data-root><div class="loading"><div><div class="spinner"></div>Загружаем друзей и награды…</div></div></div>
  </main>
  <div class="toast" data-toast></div>
  <div class="tutorial" data-tutorial hidden aria-hidden="true"><div class="tutorial-card" role="dialog" aria-modal="true" aria-labelledby="ref-tutorial-title"><button class="tutorial-close" data-tutorial-close type="button">Закрыть</button><div data-tutorial-body></div></div></div>
<script>
(() => {
  const BOT_USERNAME = "zefirok_obn_bot";
  const root = document.querySelector('[data-root]');
  const toast = document.querySelector('[data-toast]');
  const webApp = window.Telegram?.WebApp;
  let state = null;
  let initData = "";
  let busy = false;
  let tutorialStep = 0;
  const TUTORIAL_KEY = "zefirok-referrals-tutorial-v1";
  const tutorialLayer = document.querySelector("[data-tutorial]");
  const tutorialBody = document.querySelector("[data-tutorial-body]");

  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const fmtDate = (unix) => unix ? new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(Number(unix)*1000)) : '';
  const initials = (name) => (String(name||'Д').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('') || 'Д').toUpperCase();
  const REWARD_IMAGES = Object.freeze({
    case:Object.freeze({small:"/assets/cases/standart_closed.png",sweet:"/assets/cases/Bronze_close.png",gold:"/assets/cases/gold_closed.png",mythic:"/assets/cases/Mifik_case_closed.png",legendary:"/assets/cases/legendary_closed.png"}),
    booster:Object.freeze({points:"/assets/cases/boosters/1F00010C-F984-4A41-B8B6-8E5CD7DF637A.PNG",treats:"/assets/cases/boosters/80C21DC3-04A8-46F7-B8E4-9AC8FE13CCEB.PNG",coffee:"/assets/cases/boosters/11FDBEBF-D838-4DA5-AA57-9DE0E4BA26AE.PNG"}),
    points:"/assets/shop/currency_star_256x256.png",zefir:"/assets/season-pass/zefir_currency.png",coffee:"/assets/optimized/v0.79.5/iconCoffee.png",season_pass_xp:"/assets/season-pass/xp_x2.png",fallback:"/assets/ui/icon_referals.png"
  });
  const rewardImage = (reward) => { const kind=String(reward?.kind||''); if(kind==='case')return REWARD_IMAGES.case[String(reward?.id||'small')]||REWARD_IMAGES.fallback;if(kind==='booster')return REWARD_IMAGES.booster[String(reward?.id||'points')]||REWARD_IMAGES.fallback;return REWARD_IMAGES[kind]||REWARD_IMAGES.fallback; };
  const rewardImageMarkup = (reward,cls='') => `<img class="${esc(cls)}" src="${esc(rewardImage(reward))}" alt="" loading="lazy" decoding="async">`;
  const showToast = (text) => { toast.textContent=String(text||'');toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400); };
  const haptic = (value='light') => { try { webApp?.HapticFeedback?.impactOccurred?.(value); } catch {} };

  function readInitData(){
    let value='';try{value=String(webApp?.initData||'');}catch{}
    if(!value){try{const hash=new URLSearchParams(location.hash.replace(/^#/,''));value=String(hash.get('tgInitData')||'');}catch{}}
    if(!value){try{value=String(sessionStorage.getItem('zefirok-telegram-init-data')||'');}catch{}}
    if(value){try{sessionStorage.setItem('zefirok-telegram-init-data',value);}catch{}}
    return value;
  }

  async function api(path,body={}){
    const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,...body}),cache:'no-store'});
    let data=null;try{data=await response.json();}catch{}
    if(!response.ok||!data?.ok)throw new Error(data?.error||`Ошибка ${response.status}`);
    return data;
  }

  function inviteLink(){return state?.self?.code?`https://t.me/${BOT_USERNAME}?startapp=ref_${encodeURIComponent(state.self.code)}`:'';}

  function renderNetwork(){
    const items=state?.networkMilestones||[];if(!items.length)return '<div class="empty">Лестница наград пока не настроена.</div>';
    const active=Number(state.activeFriends||0);let nextMarked=false;
    return `<div class="network">${items.map(item=>{const next=!item.achieved&&!nextMarked&&Number(item.threshold)>active;if(next)nextMarked=true;return `<div class="network-card ${item.achieved?'done':next?'next':''}"><div class="network-top"><div class="network-num">${item.achieved?'✓':esc(item.threshold)}</div><span class="network-state">${item.achieved?'Получено':next?'Следующая':'Цель'}</span></div><div class="network-reward-art">${rewardImageMarkup(item.reward)}</div><strong>${esc(item.title)}</strong><span class="reward-label">${esc(item.rewardLabel)}</span></div>`;}).join('')}</div>`;
  }

  function rewardContext(row){
    if(row?.sourceType==='network')return 'Награда за количество активных друзей';
    const key=String(row?.sourceKey||'').split(':').slice(2).join(':');
    const known={starter:'Стартовый этап',level_5:'5 уровень',level_10:'10 уровень',elite:'Элитный',elite_plus:'Элитный+',level_20:'20 уровень'};
    const friend=(state?.friends||[]).find(item=>String(item.telegramId)===String(row?.inviteeTelegramId||''));
    const milestone=friend?.milestones?.find(item=>String(item.key)===key);
    const stage=milestone?.title||known[key]||'Совместный этап';
    if(row?.role==='invitee')return `Твой этап · ${stage}`;
    return friend?`${friend.displayName} · ${stage}`:`Друг · ${stage}`;
  }

  function renderRewards(){
    const rows=(state?.rewards||[]).filter(r=>r.status!=='delivered');
    if(!rows.length)return '<div class="empty">Новых подарков пока нет. Когда друг достигнет следующего этапа, награда появится здесь.</div>';
    return `<div class="reward-list">${rows.map(row=>`<div class="reward"><div class="reward-icon">${rewardImageMarkup(row.reward)}</div><div class="reward-copy"><strong>${esc(row.rewardLabel)}</strong><span>${esc(rewardContext(row))}${row.status==='failed'?' · можно повторить получение':''}</span></div><button class="claim" data-claim="${esc(row.id)}">Забрать</button></div>`).join('')}</div>`;
  }

  function renderRewardHistory(){
    const rows=(state?.rewards||[]).filter(r=>r.status==='delivered').slice(0,6);
    if(!rows.length)return '';
    return `<section class="section"><div class="head"><div><h3>Последние награды</h3><p>Здесь виден и XP, который начисляется автоматически за Элитный / Элитный+ друга.</p></div></div><div class="reward-list">${rows.map(row=>`<div class="reward"><div class="reward-icon">${rewardImageMarkup(row.reward)}</div><div class="reward-copy"><strong>${esc(row.rewardLabel)}</strong><span>${esc(rewardContext(row))}${row.deliveredAt?` · ${fmtDate(row.deliveredAt)}`:''}</span></div><span class="friend-status active">Получено</span></div>`).join('')}</div></section>`;
  }

  function renderFriends(){
    const friends=state?.friends||[];if(!friends.length)return '<div class="empty">Пока здесь никого нет. Отправь приглашение другу — его прогресс появится после первого запуска игры по твоей ссылке.</div>';
    return `<div class="friend-list">${friends.map(friend=>`<article class="friend"><div class="friend-main"><div class="avatar">${esc(initials(friend.displayName))}</div><div class="friend-name"><strong>${esc(friend.displayName)}</strong><span>Уровень ${esc(friend.profileLevel)}${friend.username?` · @${esc(friend.username)}`:''}</span></div><span class="friend-status ${friend.status==='active'?'active':''}">${friend.status==='active'?'Активный':'Осваивается'}</span></div><div class="milestones">${(friend.milestones||[]).map(m=>`<div class="milestone ${m.achieved?'done':''}"><i>${m.achieved?'✓':'○'}</i><strong>${esc(m.title)}</strong><span>${m.achieved?`Выполнено${m.achievedAt?` · ${fmtDate(m.achievedAt)}`:''}`:`${esc(m.description||'')} · Тебе: ${esc(m.inviterRewardLabel)}${m.inviteeReward?.kind&&m.inviteeReward.kind!=='none'?` · Другу: ${esc(m.inviteeRewardLabel)}`:''}`}</span></div>`).join('')}</div></article>`).join('')}</div>`;
  }

  function tutorialSteps(){
    const hours=Math.max(1,Number(state?.program?.bindWindowHours||24));
    const maxRuns=Math.max(0,Number(state?.program?.bindMaxRuns||0));
    const starter=(state?.milestoneRules||state?.friends?.[0]?.milestones||[]).find(m=>m.key==='starter');
    const starterRuns=Math.max(1,Number(starter?.triggerValue||3));
    return [
      {title:'Пригласи друга через Telegram',text:'Нажми «Пригласить друга» и отправь персональную ссылку. Привязка выполняется сервером по Telegram-приглашению — код вручную вводить не нужно.',note:'Один игрок может быть связан только с одним пригласившим.',visual:'<img src="/assets/ui/icon_referals.png" alt="">'},
      {title:'Кого система засчитает',text:`Друг должен быть новым игроком: открыть игру по твоему приглашению в течение ${hours} ч. после появления аккаунта.${maxRuns===0?' До привязки у него не должно быть ни одного зачтённого забега.':` До привязки допускается не больше ${maxRuns} зачтённых забегов.`}`,note:'Старый аккаунт нельзя задним числом превратить в реферала.',visual:'<div class="mini-path"><span>Твоя ссылка</span><b>›</b><span>Первый запуск</span><b>›</b><span>Привязка</span></div>'},
      {title:'Когда друг становится активным',text:`После привязки друг проходит стартовый этап — сейчас это ${starterRuns} подтверждённых сервером забега. Затем открываются совместные награды за уровни профиля 5, 10 и 20.`,note:'Незачтённые забеги, слишком короткие попытки и активность до привязки в реферальный прогресс не входят.',visual:'<div class="mini-path"><span>Старт</span><b>›</b><span>5 уровень</span><b>›</b><span>10</span><b>›</b><span>20</span></div>'},
      {title:'Элитный и Элитный+',text:'Если уже привязанный друг активирует Элитный или Элитный+ сезонный пропуск, пригласивший получает дополнительный XP именно в сезон, где произошла покупка.',note:'Покупка, сделанная до реферальной привязки, не выдаёт награду задним числом.',visual:'<div class="mini-path"><span>Элитный</span><b>→</b><span>+ XP</span><span>Элитный+</span><b>→</b><span>+ XP</span></div>'},
      {title:'Моё кафе — общая лестница',text:'Каждый активированный друг увеличивает общий счётчик. На порогах 1 / 3 / 5 / 10 / 20 / 50 открываются отдельные большие подарки. Изображение на каждой плитке показывает, что именно ты получишь.',note:'Награды выдаются сервером один раз. Самоприглашение, повторная привязка и попытка связать один аккаунт с несколькими людьми блокируются.',visual:'<div class="mini-path"><span>1 🎁</span><span>3 🎁</span><span>5 🎁</span><span>10 🎁</span></div>'}
    ];
  }
  function renderTutorial(){
    if(!tutorialLayer||!tutorialBody)return;const steps=tutorialSteps();tutorialStep=Math.max(0,Math.min(steps.length-1,tutorialStep));const step=steps[tutorialStep];tutorialBody.innerHTML=`<div class="tutorial-progress">Шаг ${tutorialStep+1} из ${steps.length}</div><div class="tutorial-visual">${step.visual}</div><h2 id="ref-tutorial-title">${esc(step.title)}</h2><p>${esc(step.text)}</p><div class="tutorial-note">${esc(step.note)}</div><div class="tutorial-dots">${steps.map((_,i)=>`<span class="tutorial-dot ${i===tutorialStep?'active':''}"></span>`).join('')}</div><div class="tutorial-actions"><button class="tutorial-prev" data-tutorial-prev type="button" ${tutorialStep===0?'disabled':''}>Назад</button><button class="tutorial-next" data-tutorial-next type="button">${tutorialStep===steps.length-1?'Понятно':'Дальше'}</button></div>`;
  }
  function openTutorial(automatic=false){if(!tutorialLayer||!state)return;tutorialStep=0;renderTutorial();tutorialLayer.hidden=false;tutorialLayer.setAttribute('aria-hidden','false');if(!automatic)haptic();}
  function closeTutorial(markSeen=true){if(!tutorialLayer)return;tutorialLayer.hidden=true;tutorialLayer.setAttribute('aria-hidden','true');if(markSeen){try{localStorage.setItem(TUTORIAL_KEY,'1');}catch{}}}
  function maybeOpenTutorial(){let seen=false;try{seen=localStorage.getItem(TUTORIAL_KEY)==='1';}catch{}if(!seen)setTimeout(()=>openTutorial(true),220);}

  function render(){
    if(!state)return;
    const next=state.nextNetworkMilestone;
    const programOff=state.program?.enabled===false;
    root.innerHTML=`
      <section class="hero">
        <div class="kicker">Сладкий Забег · вместе веселее</div>
        <h2>Собирай друзей в кафе</h2>
        <p>Друг играет и развивается — вы получаете совместные подарки. Если приглашённый друг активирует Элитный или Элитный+, ты получишь дополнительный XP сезонного пропуска.</p>
        <div class="hero-stats"><div class="stat"><small>Активные друзья</small><strong>${esc(state.activeFriends||0)}</strong></div><div class="stat"><small>${next?'До следующего подарка':'Лестница пройдена'}</small><strong>${next?`${esc(next.remaining)} друг${Number(next.remaining)===1?'':'а'}`:'✓'}</strong></div></div>
        <div class="invite"><button class="primary" data-invite ${programOff?'disabled':''}>${programOff?'Приглашения временно выключены':'Пригласить друга'}</button><div class="invite-code"><span>Твой код</span><code>${esc(state.self?.code||'—')}</code><button class="secondary" style="min-height:32px;padding:0 10px;font-size:9px" data-copy>Копировать</button></div></div>
      </section>
      ${state.inviter?`<section class="section"><div class="head"><div><h3>Кто пригласил тебя</h3><p>Ваш совместный путь уже связан сервером.</p></div></div><div class="inviter"><div class="avatar">${esc(initials(state.inviter.displayName))}</div><div class="friend-name"><strong>${esc(state.inviter.displayName)}</strong><span>${state.inviter.status==='active'?'Вы уже активировали совместные награды':'Заверши стартовый этап, чтобы активировать дружбу'}</span></div></div></section>`:''}
      <section class="section"><div class="head"><div><h3>Моё кафе</h3><p>Большие подарки за количество активных друзей.</p></div><span class="badge">${esc(state.activeFriends||0)} активных</span></div>${renderNetwork()}</section>
      <section class="section"><div class="head"><div><h3>Готовые подарки</h3><p>Каждая награда выдаётся сервером только один раз.</p></div>${Number(state.pendingCount||0)>1?'<button class="claim-all" data-claim-all>Забрать все</button>':''}</div>${renderRewards()}</section>
      ${renderRewardHistory()}
      <section class="section"><div class="head"><div><h3>Твои друзья</h3><p>Следи за этапами каждого приглашённого игрока.</p></div><span class="badge">${esc(state.totalInvited||0)} всего</span></div>${renderFriends()}</section>
      <div class="notice">Друг считается активным после стартового этапа. Привязка работает только для нового игрока, который впервые запустил игру по твоему Telegram-приглашению; один аккаунт нельзя привязать к нескольким пригласившим.</div>`;
  }

  async function load(){
    initData=readInitData();if(!initData){root.innerHTML='<div class="empty" style="margin-top:30px">Открой «Сладкий Забег» внутри Telegram, чтобы загрузить реферальную систему.</div>';return;}
    try{state=await api('/api/referrals/state');render();maybeOpenTutorial();}catch(error){root.innerHTML=`<div class="empty" style="margin-top:30px">${esc(error.message||'Не удалось загрузить страницу.')}<br><br><button class="secondary" data-retry>Повторить</button></div>`;}
  }

  async function shareInvite(){
    const link=inviteLink();if(!link)return;haptic();
    const text='Заходи в «Сладкий Забег» — будем получать совместные подарки в «Друзьях кафе» ☕🎁';
    try{
      if(navigator.share){await navigator.share({title:'Сладкий Забег',text,url:link});return;}
    }catch(error){if(error?.name==='AbortError')return;}
    const share=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
    try{webApp?.openTelegramLink?.(share);return;}catch{}
    try{await navigator.clipboard.writeText(link);showToast('Ссылка скопирована');}catch{location.href=share;}
  }

  async function copyInvite(){const link=inviteLink();if(!link)return;try{await navigator.clipboard.writeText(link);haptic();showToast('Ссылка приглашения скопирована');}catch{showToast(`Код: ${state.self?.code||''}`);}}

  async function claim(id){if(busy)return;busy=true;const button=[...document.querySelectorAll('[data-claim]')].find(node=>node.dataset.claim===String(id));if(button)button.disabled=true;try{const data=await api('/api/referrals/claim',{rewardId:id});state=data.state;haptic('medium');showToast('Подарок получен 🎁');render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}}catch(error){showToast(error.message||'Не удалось получить подарок');if(button)button.disabled=false;}finally{busy=false;}}
  async function claimAll(){if(busy)return;busy=true;document.querySelector('[data-claim-all]')?.setAttribute('disabled','');try{const data=await api('/api/referrals/claim-all');state=data.state;haptic('medium');showToast(data.delivered?`Получено наград: ${data.delivered}`:'Новых наград нет');render();try{window.parent.postMessage({type:'zefirok-referrals-account-updated'},'*');}catch{}}catch(error){showToast(error.message||'Не удалось получить награды');}finally{busy=false;}}

  document.addEventListener('click',(event)=>{if(event.target.closest('[data-tutorial-open]')){openTutorial(false);return;}if(event.target.closest('[data-tutorial-close]')){closeTutorial(true);return;}if(event.target.closest('[data-tutorial-prev]')){tutorialStep=Math.max(0,tutorialStep-1);renderTutorial();haptic();return;}if(event.target.closest('[data-tutorial-next]')){const steps=tutorialSteps();if(tutorialStep>=steps.length-1){closeTutorial(true);haptic('medium');}else{tutorialStep+=1;renderTutorial();haptic();}return;}const invite=event.target.closest('[data-invite]');if(invite){shareInvite();return;}const copy=event.target.closest('[data-copy]');if(copy){copyInvite();return;}const claimButton=event.target.closest('[data-claim]');if(claimButton){claim(claimButton.dataset.claim);return;}if(event.target.closest('[data-claim-all]')){claimAll();return;}if(event.target.closest('[data-retry]')){root.innerHTML='<div class="loading"><div><div class="spinner"></div>Загружаем…</div></div>';load();return;}});
  const close=()=>{try{window.parent.postMessage({type:'zefirok-close-referrals'},'*');if(window.parent!==window)return;}catch{}history.length>1?history.back():location.assign('/?screen=profile');};
  try{webApp?.ready?.();webApp?.expand?.();webApp?.disableVerticalSwipes?.();webApp?.BackButton?.onClick?.(close);webApp?.BackButton?.show?.();}catch{}
  window.addEventListener('message',(event)=>{if(event.data?.type==='zefirok-host-viewport-changed'){try{document.documentElement.style.setProperty('--app-height',`${Number(event.data.payload?.height||0)}px`);}catch{}}});
  load();
})();
</script>
</body>
</html>
