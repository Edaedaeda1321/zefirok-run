(()=>{
  const FALLBACK="/assets/ui/error404-no-icon.webp";
  if(window.__ZEFIROK_IMAGE_FALLBACK_V1__)return;
  window.__ZEFIROK_IMAGE_FALLBACK_V1__=true;
  window.ZEFIROK_IMAGE_FALLBACK=FALLBACK;
  const bad=value=>/^(?:|undefined|null|false|nan|\[object object\])$/i.test(String(value??"").trim());
  const sameFallback=value=>{try{return new URL(String(value||""),document.baseURI).pathname===FALLBACK}catch{return String(value||"")===FALLBACK}};
  const replace=(img,reason,failed)=>{
    if(!(img instanceof HTMLImageElement))return;
    const current=String(img.currentSrc||img.getAttribute("src")||img.src||"");
    if(sameFallback(current))return;
    img.dataset.zefirokImageError=reason||"load-error";
    img.dataset.zefirokFailedSrc=String(failed||current||"").slice(0,1000);
    img.onerror=null;
    img.removeAttribute("srcset");
    img.src=FALLBACK;
  };
  const inspect=img=>{
    if(!(img instanceof HTMLImageElement)||!img.hasAttribute("src"))return;
    const raw=String(img.getAttribute("src")||"").trim();
    if(bad(raw)){replace(img,"invalid-src",raw);return;}
    if(!sameFallback(raw)&&img.complete&&img.naturalWidth===0)replace(img,"load-error",raw);
  };
  document.addEventListener("error",event=>{
    const img=event.target;
    if(!(img instanceof HTMLImageElement))return;
    if(sameFallback(img.currentSrc||img.src||img.getAttribute("src")))return;
    event.preventDefault?.();
    event.stopImmediatePropagation?.();
    replace(img,"load-error",img.currentSrc||img.src||img.getAttribute("src")||"");
  },true);
  const scan=root=>{
    if(root instanceof HTMLImageElement)inspect(root);
    root?.querySelectorAll?.("img").forEach(inspect);
  };
  const boot=()=>{
    scan(document);
    new MutationObserver(records=>{for(const record of records){if(record.type==="attributes")inspect(record.target);else record.addedNodes.forEach(scan);}}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["src","srcset"]});
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else queueMicrotask(boot);
  window.zefirokImageSrc=value=>bad(value)?FALLBACK:String(value).trim();
})();

<body>
<div class="app"><header class="top"><div class="bar"><h1 id="pageTitle">Альбом Зеффи</h1><button type="button" class="zgt-launch" data-zgt-help aria-label="Как работает этот раздел">?</button><button class="reload" id="reload" type="button" aria-label="Обновить">↻</button></div></header><main class="main" id="main"><div class="loading"><div><div class="spinner"></div>Открываем Альбом…</div></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,currentId='',filter='all',busy=false,toastTimer=0;
try{tg?.ready?.();tg?.expand?.();tg?.disableVerticalSwipes?.();}catch{}try{window.parent.postMessage({type:'zefirok-request-fullscreen'},'*');}catch{}
function haptic(kind='light'){try{kind==='success'?tg?.HapticFeedback?.notificationOccurred?.('success'):tg?.HapticFeedback?.impactOccurred?.(kind);}catch{}}
function toast(text,error=false){const el=$('toast');el.textContent=text;el.style.background=error?'#9f4354':'#49313a';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function initData(){let value='';try{value=String(tg?.initData||'');}catch{}if(value)return value;try{const h=new URLSearchParams(location.hash.replace(/^#/,''));return String(h.get('tgInitData')||'');}catch{return '';}}
async function api(path,payload={}){const id=initData();if(!id)throw new Error('Telegram не передал данные входа. Откройте Альбом из игры.');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:id,...payload}),cache:'no-store',credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok||d?.ok===false)throw new Error(d?.error||`Ошибка ${r.status}`);return d;}
function plural(n,one,few,many){const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?many:y===1?one:y>=2&&y<=4?few:many;}
function kindLabel(k){return ({avatar:'Аватарка',frame:'Рамка',trail:'След',skin:'Скин',music:'Музыка'})[k]||k;}
function renderLanding(){currentId='';filter='all';$('pageTitle').textContent='Альбом Зеффи';const s=data?.summary||{},collections=data?.collections||[];$('main').innerHTML=`<div class="landing"><section class="hero"><small>Коллекции и воспоминания</small><h2>Альбом Зеффи</h2><p>Собирайте аватарки, рамки, следы, скины и музыку из приключений Зеффи. Каждый альбом — отдельная история.</p><div class="summary"><div class="metric"><b>${s.ownedRequired||0}/${s.requiredTotal||0}</b><span>обязательных предметов</span></div><div class="metric"><b>${s.progressPercent||0}%</b><span>общий прогресс</span></div><div class="metric"><b>${s.completedCollections||0}/${s.collections||0}</b><span>альбомов собрано</span></div></div></section><div class="section-head"><div><h3>Мои альбомы</h3><p>${collections.length?`${collections.length} ${plural(collections.length,'история','истории','историй')}`:'Опубликованных альбомов пока нет'}</p></div></div><div class="albums">${collections.length?collections.map(albumCard).join(''):'<div class="empty">Здесь появятся тематические коллекции после публикации в Control Center.</div>'}</div></div>`;document.querySelectorAll('[data-open-album]').forEach(b=>b.onclick=()=>openAlbum(b.dataset.openAlbum));}
function albumCard(a){const accent=esc(a.accentColor||'#d96f9b'),bg=a.backgroundUrl?`url(&quot;${esc(a.backgroundUrl)}&quot;)`:'';return `<article class="album-card" data-open-album="${esc(a.collectionId)}" style="--accent:${accent}"><div class="album-cover" style="${bg?`background-image:linear-gradient(110deg,rgba(255,255,255,.98) 4%,rgba(255,255,255,.88) 64%,rgba(255,255,255,.68)),${bg}`:''}"></div><div class="album-body"><h4>${esc(a.title)}</h4><p>${esc(a.subtitle||'Коллекция Зеффи')}</p><div class="progress-line"><div class="track"><i style="width:${Math.max(0,Math.min(100,a.progressPercent||0))}%"></i></div><b>${a.progressPercent||0}%</b></div><div class="album-foot"><span class="pill ${a.complete?'done':''}">${a.complete?'✓ СОБРАНО':`${a.ownedRequired}/${a.requiredTotal}`}</span></div></div><div class="album-side"><div class="album-art-shell"><img class="album-art" loading="lazy" src="${esc(a.coverUrl||'/assets/ui/error404-no-icon.webp')}" alt=""></div><button class="open" type="button">Открыть</button></div></article>`;}
function openAlbum(id){const a=data?.collections?.find(x=>x.collectionId===id);if(!a)return;currentId=id;filter='all';$('pageTitle').textContent=a.title;renderDetail(a);try{$('main').scrollTo({top:0,behavior:'instant'});}catch{$('main').scrollTop=0;}haptic();}
function rewardHtml(r){return `<div class="reward"><img loading="lazy" src="${esc(r.imageUrl||'/assets/ui/error404-no-icon.webp')}" alt=""><b>${esc(r.title||'Награда')}</b></div>`;}
function milestoneHtml(m){const state=m.status||'locked',button=state==='claimed'?'<button class="claim" disabled>Получено</button>':state==='pending'?'<button class="claim" disabled>Получаем…</button>':state==='failed'?'<button class="claim" disabled>Ошибка доставки</button>':m.eligible?`<button class="claim" data-claim="${esc(m.milestoneId)}">Забрать</button>`:'<button class="claim" disabled>Закрыто</button>';return `<article class="milestone ${state==='claimed'?'claimed':m.eligible?'ready':''}"><div class="milestone-top"><b>${m.thresholdPercent}%</b><span>${state==='claimed'?'✓ Получено':state==='failed'?'Нужна проверка':m.eligible?'Доступно':'Ещё не открыто'}</span></div><h4>${esc(m.title||`${m.thresholdPercent}% коллекции`)}</h4>${(m.rewards||[]).map(rewardHtml).join('')}${button}</article>`;}
function renderDetail(a){const bg=a.backgroundUrl?`background-image:linear-gradient(95deg,rgba(255,255,255,.96),rgba(255,255,255,.84) 68%,rgba(255,255,255,.66)),url(&quot;${esc(a.backgroundUrl)}&quot;);`:'';$('main').innerHTML=`<div class="detail active" style="--accent:${esc(a.accentColor||'#d96f9b')}"><section class="detail-hero" style="${bg}"><div class="detail-main"><span class="pill ${a.complete?'done':''}">${a.complete?'✓ КОЛЛЕКЦИЯ СОБРАНА':'АЛЬБОМ ЗЕФФИ'}</span><h2>${esc(a.title)}</h2><p>${esc(a.subtitle||'Соберите все обязательные воспоминания этой истории.')}</p><div class="big-progress"><strong><span>${a.ownedRequired} из ${a.requiredTotal}</span><span>${a.progressPercent}%</span></strong><div class="track"><i style="width:${a.progressPercent}%"></i></div></div></div>${a.coverUrl?`<div class="detail-cover-shell"><img class="detail-cover" src="${esc(a.coverUrl)}" alt=""></div>`:'<div class="detail-cover-shell" aria-hidden="true"></div>'}</section>${a.milestones?.length?`<div class="section-head"><div><h3>Награды за коллекцию</h3><p>Этапы выдаются один раз</p></div></div><div class="milestones">${a.milestones.map(milestoneHtml).join('')}</div>`:''}<div class="section-head"><div><h3>Страницы коллекции</h3><p>${a.ownedTotal} из ${a.totalItems} предметов найдено</p></div></div><div class="filters">${[['all','Все'],['avatar','Аватарки'],['frame','Рамки'],['trail','Следы'],['skin','Скины'],['music','Музыка']].map(([k,t])=>`<button type="button" data-filter="${k}" class="${filter===k?'active':''}">${t}</button>`).join('')}</div><div class="items" id="items"></div></div>`;renderItems(a);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderItems(a);});document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(a,b.dataset.claim,b));}
function renderItems(a){const items=(a.items||[]).filter(x=>filter==='all'||x.kind===filter);$('items').innerHTML=items.length?items.map(item=>{if(item.secret&&!item.owned)return `<article class="item secret">${item.required?'<span class="req">нужно</span>':''}<div class="item-art"><div class="secret-mark">?</div></div><b>???</b><span>${esc(kindLabel(item.kind))} · секрет</span></article>`;return `<article class="item ${item.owned?'owned':''}">${item.required?'<span class="req">нужно</span>':''}${item.owned?'<span class="check" aria-label="Собрано"></span>':''}<div class="item-art"><img loading="lazy" src="${esc(item.imageUrl||'/assets/ui/error404-no-icon.webp')}" alt=""></div><b>${esc(item.title||item.itemId||'Предмет')}</b><span>${esc(kindLabel(item.kind))} · ${esc(item.rarity||'common')}${item.required?'':' · бонус'}</span></article>`;}).join(''):'<div class="empty" style="grid-column:1/-1">В этой категории предметов нет.</div>';}
async function refreshClaimState(collectionId,milestoneId,attempt=0){if(attempt>2)return;window.setTimeout(async()=>{try{const fresh=await api('/api/album/state');data=fresh;const a=fresh.collections?.find(x=>x.collectionId===collectionId),m=a?.milestones?.find(x=>x.milestoneId===milestoneId);if(currentId===collectionId&&a)renderDetail(a);if(m?.status==='pending')refreshClaimState(collectionId,milestoneId,attempt+1);else if(m?.status==='claimed'){toast('Награда получена');try{window.parent.postMessage({type:'zefirok-album-account-updated',revision:Number(fresh.accountRevision||0)},'*');}catch{}}else if(m?.status==='failed')toast('Доставка награды остановлена. Нужна проверка в Control Center.',true);}catch{}},1200+attempt*900);}
async function claim(a,milestoneId,button){if(busy)return;busy=true;button.disabled=true;button.textContent='Получаем…';try{const requestId=`album-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`,result=await api('/api/album/claim',{collectionId:a.collectionId,milestoneId,requestId});data=result.state||await api('/api/album/state');const updated=data.collections.find(x=>x.collectionId===a.collectionId),updatedMilestone=updated?.milestones?.find(x=>x.milestoneId===milestoneId);renderDetail(updated||a);if(updatedMilestone?.status==='failed')toast('Доставка награды остановлена. Нужна проверка в Control Center.',true);else if(updatedMilestone?.status==='pending'){toast('Награда в доставке…');refreshClaimState(a.collectionId,milestoneId);}else{haptic('success');toast('Награда получена');}try{window.parent.postMessage({type:'zefirok-album-account-updated',revision:Number(data.accountRevision||0)},'*');}catch{}}catch(e){toast(e.message,true);button.disabled=false;button.textContent='Забрать';}finally{busy=false;}}
async function load(){if(busy)return;busy=true;try{data=await api('/api/album/state');if(currentId&&data.collections?.some(x=>x.collectionId===currentId))openAlbum(currentId);else renderLanding();}catch(e){$('main').innerHTML=`<div class="error"><b>Не удалось открыть Альбом</b><br><br>${esc(e.message)}</div>`;}finally{busy=false;}}
function close(){try{window.parent.postMessage({type:'zefirok-close-album'},'*');}catch{history.back();}}
function handleHostBack(){if(window.ZefirokPageGuide?.closeIfOpen())return;if(currentId){renderLanding();try{$('main').scrollTo({top:0,behavior:'instant'});}catch{$('main').scrollTop=0;}haptic();return;}close();}
$('reload').onclick=()=>load();window.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;if(m.type==='zefirok-album-back'){handleHostBack();return;}if(m.type==='zefirok-host-viewport-changed'){const p=m.payload||{};if(Number(p.height)>0)document.documentElement.style.setProperty('--app-h',`${Number(p.height)}px`);const safe=p.contentSafeArea||{};document.documentElement.style.setProperty('--safe-top',`${Number(safe.top||0)}px`);document.documentElement.style.setProperty('--safe-bottom',`${Number(safe.bottom||0)}px`);}});load();
})();
</script>

<script id="zefirok-context-guide-20260910">
(()=>{
"use strict";
// UI-only tutorial deck. No network calls, rewards, economy or save-state writes.
function createTutorialDeck(layer, mount, options, words) {
  let data = null, gesture = null, timer = 0, frame = 0, serial = 0, closing = false, suppressUntil = 0;
  const uid = 'zgt-title-' + Math.random().toString(36).slice(2, 9);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const active = () => !layer.hidden && (!options.isActive || options.isActive());
  const reduced = () => window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches === true;
  const safeImage = src => {
    const value = String(src || '');
    return /^(?:\/(?!\/)|data:image\/(?:png|webp|jpeg|gif);base64,)/i.test(value) ? value : '';
  };
  const image = (src, cls = '') => { const url = safeImage(src); return url ? `<img class="${cls}" src="${esc(url)}" alt="" decoding="async" loading="lazy" draggable="false">` : ''; };
  const iconFallback = '<span class="zgt-symbol" aria-hidden="true">&#10022;</span>';
  const count = () => Array.isArray(data?.steps) ? data.steps.length : 0;
  mount.innerHTML = `<div class="zgt-header" data-zgt-header><button class="zgt-grip" data-zgt-grip type="button" aria-label="${esc(words.close)}" title="${esc(words.pull)}"><span></span></button><div class="zgt-top"><span class="zgt-mode" data-zgt-mode></span><button class="zgt-topics" data-zgt-menu type="button">${esc(words.topics)}</button><button class="zgt-close" data-zgt-close type="button" aria-label="${esc(words.close)}">&#215;</button></div><div class="zgt-segments" data-zgt-segments role="group" aria-label="${esc(words.steps)}"></div></div><div class="zgt-body" data-zgt-body tabindex="-1"></div><div class="zgt-footer"><button class="zgt-prev" data-zgt-prev type="button">${esc(words.back)}</button><button class="zgt-next" data-zgt-next type="button">${esc(words.next)}</button></div>`;
  const panel = mount.closest('[role="dialog"]') || mount;
  panel.setAttribute('aria-labelledby', uid);
  const mode = mount.querySelector('[data-zgt-mode]'), segments = mount.querySelector('[data-zgt-segments]');
  const body = mount.querySelector('[data-zgt-body]'), prev = mount.querySelector('[data-zgt-prev]'), next = mount.querySelector('[data-zgt-next]');
  const menu = mount.querySelector('[data-zgt-menu]'), grip = mount.querySelector('[data-zgt-grip]');
  function resetMotion() {
    ++serial; clearTimeout(timer); timer = 0; cancelAnimationFrame(frame); frame = 0;
    const previous = gesture; gesture = null; closing = false;
    if(previous?.kind === 'pointer') try { panel.releasePointerCapture(previous.id); } catch {}
    panel.style.transform = ''; panel.style.transition = ''; panel.style.willChange = '';
    body.style.transform = ''; body.style.transition = ''; body.style.willChange = '';
    layer.style.backgroundColor = ''; layer.style.transition = '';
    panel.classList.remove('zgt-dragging'); grip.classList.remove('zgt-armed');
  }
  const miniBar = v => `<span class="zgt-track"><i style="--zgt-progress:${Math.max(0,Math.min(100,Number(v)||0))}%"></i></span>`;
  function sceneHtml(scene, fallback) {
    const s = scene || {}, rows = Array.isArray(s.items) ? s.items : [], assets = data.assets || {};
    const tag = `<div class="zgt-scene-heading"><strong>${esc(s.title || '')}</strong><span>${esc(words.example)}</span></div>`;
    let inner = '';
    if(s.kind === 'jump') {
      inner = `<div class="zgt-jump-ground"><span class="zgt-jump-dog">${image(assets[s.imageKey] || fallback)}</span><span class="zgt-jump-obstacle">${image(assets[s.obstacleKey] || fallback)}</span><span class="zgt-tap-label">${esc(words.tap)}</span></div>`;
    } else if(s.kind === 'week') {
      inner = `<div class="zgt-week-art">${image(s.image || fallback)}</div><div class="zgt-week">${rows.map((r,i)=>`<span class="${i === rows.length-1?'zgt-final-day':''}">${i+1}<small>${i===rows.length-1?'&#10022;':'&#10003;'}</small></span>`).join('')}</div>`;
    } else if(s.kind === 'route' || s.kind === 'states') {
      inner = `<div class="zgt-route">${rows.map((r,i)=>`<div class="zgt-route-row"><span class="zgt-route-number">${i+1}</span><span><strong>${esc(r.title)}</strong><small>${esc(r.subtitle)}</small></span>${i===rows.length-1?'<span class="zgt-check" aria-hidden="true">&#10003;</span>':''}</div>`).join('')}</div>`;
    } else if(s.kind === 'pair') {
      inner = `<div class="zgt-pair">${rows.map(r=>`<div class="zgt-pair-person">${image(s.image || fallback)}<strong>${esc(r.title)}</strong>${miniBar(r.value)}<small>${esc(r.subtitle)}</small></div>`).join('')}</div>`;
    } else if(s.kind === 'profile') {
      inner = `<div class="zgt-profile-preview">${image(s.image || fallback)}<div>${rows.map(r=>`<div><strong>${esc(r.title)}</strong><small>${esc(r.subtitle)}</small></div>`).join('')}</div></div>`;
    } else if(s.kind === 'progress') {
      inner = `<div class="zgt-progress-preview">${image(s.image || fallback)}<strong>${esc(rows[0]?.title)}</strong><span>${esc(rows[0]?.subtitle)}</span>${miniBar(rows[0]?.value ?? 60)}<div class="zgt-progress-stages">${rows.slice(1).map(r=>`<span><b>${esc(r.title)}</b><small>${esc(r.subtitle)}</small></span>`).join('')}</div></div>`;
    } else if(s.kind === 'tabs') {
      inner = `<div class="zgt-demo-tabs">${rows.map((r,i)=>`<span class="${i===0?'zgt-selected':''}">${esc(r.title)}</span>`).join('')}</div><div class="zgt-tab-preview">${(s.rows || []).map(r=>`${image(r.image || fallback)}<div><strong>${esc(r.title)}</strong><small>${esc(r.subtitle)}</small></div>`).join('')}</div>`;
    } else {
      inner = `<div class="zgt-cards ${rows.length===4?'zgt-four':''}">${rows.map(r=>`<div class="zgt-mini-card">${image(r.image || s.image || fallback) || iconFallback}<strong>${esc(r.title)}</strong><small>${esc(r.subtitle)}</small></div>`).join('')}</div>`;
    }
    return `<div class="zgt-scene zgt-scene-${esc(s.kind||'cards')}" data-zgt-scene aria-label="${esc(words.example)}: ${esc(s.title)}">${tag}${inner}</div>`;
  }
  function render(value) {
    const segmentHadFocus = segments.contains(document.activeElement);
    resetMotion(); data = value;
    const list = Array.isArray(data.steps) ? data.steps : [];
    data.index = Math.max(0, Math.min(list.length - 1, Number(data.index) || 0));
    mode.innerHTML = `${image(data.icon)}<span>${esc(data.title)}</span>`;
    menu.hidden = !data.topics?.length || data.directory === true;
    segments.hidden = data.directory === true;
    prev.hidden = data.directory === true;
    prev.disabled = data.index === 0;
    if(data.directory) {
      body.innerHTML = `<h2 id="${uid}">${esc(words.directory)}</h2><p class="zgt-description">${esc(words.directoryCopy)}</p><div class="zgt-topic-grid">${(data.topics || []).map(t=>`<button class="zgt-topic" data-zgt-topic="${esc(t.id)}" type="button">${image(t.icon)}<span><strong>${esc(t.title)}</strong><small>${esc(t.summary)}</small></span></button>`).join('')}</div>`;
      segments.replaceChildren(); next.textContent = words.close;
    } else {
      const step = list[data.index]; if(!step) { body.textContent = words.empty; return; }
      segments.innerHTML = list.map((s,i)=>`<button class="zgt-segment ${i<data.index?'zgt-past':''}" data-zgt-step="${i}" type="button" aria-label="${esc(words.step)} ${i+1}: ${esc(s.title)}" ${i===data.index?'aria-current="step"':''}><span></span></button>`).join('');
      body.innerHTML = `${sceneHtml(step.scene,data.icon)}<h2 id="${uid}" tabindex="-1">${esc(step.title)}</h2><p class="zgt-description">${esc(typeof step.text === 'function' ? step.text() : step.text)}</p>${step.tip?`<div class="zgt-note"><span aria-hidden="true">i</span><p>${esc(typeof step.tip === 'function' ? step.tip() : step.tip)}</p></div>`:''}<span class="zgt-sr" aria-live="polite">${esc(words.step)} ${data.index+1} ${esc(words.of)} ${list.length}</span>`;
      next.textContent = data.index === list.length - 1 ? (data.finishLabel || words.done) : words.next;
    }
    body.scrollTop = 0;
    if(segmentHadFocus && active() && !data.directory) segments.querySelector('[aria-current=step]')?.focus({preventScroll:true});
  }
  function navigate(index) {
    if(!active() || closing || data?.directory || !Number.isInteger(index) || index < 0 || index >= count() || index === data.index) return;
    options.onStep(index);
  }
  function onClick(event) {
    if(!active()) return;
    if(performance.now() < suppressUntil) { event.preventDefault(); event.stopImmediatePropagation(); return; }
    const target = event.target instanceof Element ? event.target : null;
    if(!target) return;
    const close = target.closest('[data-zgt-close]'), handle = target.closest('[data-zgt-grip]');
    const topic = target.closest('[data-zgt-topic]'), step = target.closest('[data-zgt-step]');
    if(close || (handle && event.detail === 0) || target === layer) { options.onDismiss(); event.stopPropagation(); return; }
    if(target.closest('[data-zgt-menu]')) { options.onTopic?.('topics'); event.stopPropagation(); return; }
    if(topic) { options.onTopic?.(topic.dataset.zgtTopic); event.stopPropagation(); return; }
    if(step) { navigate(Number(step.dataset.zgtStep)); event.stopPropagation(); return; }
    if(target.closest('[data-zgt-prev]')) { navigate(data.index-1); event.stopPropagation(); return; }
    if(target.closest('[data-zgt-next]')) {
      if(data?.directory) options.onDismiss();
      else if(data.index >= count()-1) options.onFinish();
      else navigate(data.index+1);
      event.stopPropagation();
    }
  }
  layer.addEventListener('click',onClick,true);
  document.addEventListener('keydown',event=>{
    if(!active()) return;
    if(event.key === 'Escape') { event.preventDefault(); event.stopImmediatePropagation(); options.onDismiss(); return; }
    const target = event.target instanceof Element ? event.target : null;
    if((event.key==='ArrowRight'||event.key==='ArrowLeft') && !target?.matches('input,textarea,select') && !data.directory) {
      event.preventDefault(); event.stopImmediatePropagation(); navigate(data.index+(event.key==='ArrowRight'?1:-1)); return;
    }
    if(event.key !== 'Tab') return;
    const nodes = [...mount.querySelectorAll('button:not(:disabled),[tabindex="0"]')].filter(el=>!el.hidden && el.getClientRects().length);
    const first = nodes[0], last = nodes[nodes.length-1];
    if(!first) return;
    if(event.shiftKey && (document.activeElement === first || !mount.contains(document.activeElement))) { event.preventDefault(); last.focus(); }
    else if(!event.shiftKey && (document.activeElement === last || !mount.contains(document.activeElement))) { event.preventDefault(); first.focus(); }
  },true);
  const touchFor = (list,id) => Array.from(list||[]).find(t=>t.identifier===id);
  const interactive = target => target instanceof Element && !target.closest('[data-zgt-grip]') && !!target.closest('button,a,input,textarea,select,summary,[contenteditable="true"]');
  function begin(kind,id,x,y,target) {
    if(!active() || closing || gesture || interactive(target)) return false;
    const header = target instanceof Element && !!target.closest('[data-zgt-header]');
    const scene = target instanceof Element && !!target.closest('[data-zgt-scene]');
    if(!header && !scene && (body.scrollTop||0)>1) return false;
    resetMotion();
    gesture = {kind,id,x,y,header,scene,axis:null,dx:0,dy:0,lastY:y,lastAt:performance.now(),velocity:0,height:panel.offsetHeight};
    return true;
  }
  function move(x,y,event) {
    const g = gesture; if(!g || !active() || closing) return;
    const dx=x-g.x, dy=y-g.y;
    if(!g.axis) {
      if(g.scene && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)*1.25) g.axis='x';
      else if(dy>0 && Math.abs(dx)<=Math.max(4,dy*.7) && (g.header || (body.scrollTop||0)<=1)) {
        if(!event.cancelable) { resetMotion(); return; }
        event.preventDefault(); if(dy<3) return; g.axis='y';
      } else { if(Math.max(Math.abs(dx),Math.abs(dy))>=9) resetMotion(); return; }
      panel.classList.add('zgt-dragging');
    }
    if(!event.cancelable) { resetMotion(); return; }
    event.preventDefault();
    const now=performance.now(); g.velocity=(y-g.lastY)/Math.max(1,now-g.lastAt); g.lastAt=now; g.lastY=y;
    g.dx=dx; g.dy=Math.max(0,dy);
    if(!frame) frame=requestAnimationFrame(()=>{
      frame=0; if(gesture!==g || !active()) return;
      if(g.axis==='x') { body.style.willChange='transform'; body.style.transform=`translate3d(${Math.max(-60,Math.min(60,g.dx*.2))}px,0,0)`; }
      else {
        panel.style.willChange='transform';panel.style.transform=`translate3d(0,${Math.min(g.height*.95,g.dy)}px,0)`;
        layer.style.backgroundColor=`rgba(56,34,46,${Math.max(.06,.40*(1-g.dy/Math.max(1,g.height))).toFixed(3)})`;
        grip.classList.toggle('zgt-armed',g.dy>=Math.max(90,Math.min(180,g.height*.28)));
      }
    });
  }
  function finish(cancelled=false) {
    const g=gesture; if(!g) return;
    gesture=null; cancelAnimationFrame(frame); frame=0;
    if(g.kind==='pointer') try { panel.releasePointerCapture(g.id); } catch {}
    if(!g.axis) { resetMotion(); return; }
    suppressUntil=performance.now()+420;
    const velocity=performance.now()-g.lastAt<100?g.velocity:0;
    const limit=Math.max(90,Math.min(180,g.height*.28));
    const close=!cancelled && active() && g.axis==='y' && (g.dy>=limit || (g.dy>=55&&velocity>.85));
    const horizontal=!cancelled && g.axis==='x' && Math.abs(g.dx)>=55;
    if(horizontal) {
      const destination=data.index+(g.dx<0?1:-1); resetMotion(); navigate(destination); return;
    }
    closing=close; const token=++serial;
    const duration=reduced()?0:close?230:210;
    panel.style.transition=`transform ${duration}ms cubic-bezier(.22,.8,.25,1)`;
    body.style.transition=`transform ${duration}ms ease`;
    layer.style.transition=`background-color ${duration}ms ease`;
    panel.style.transform=close?`translate3d(0,${Math.max(g.height+40,window.innerHeight)}px,0)`:'translate3d(0,0,0)';
    body.style.transform='translate3d(0,0,0)';layer.style.backgroundColor=close?'rgba(56,34,46,0)':'';
    const done=()=>{if(token!==serial)return;const commit=close&&active();resetMotion();if(commit)options.onDismiss();};
    if(!duration) done(); else timer=setTimeout(done,duration+30);
  }
  panel.addEventListener('pointerdown',event=>{
    if(event.pointerType==='touch'||event.button!==0||event.isPrimary===false) return;
    const target=event.target instanceof Element?event.target:null;
    if(!target?.closest('[data-zgt-header],[data-zgt-scene]'))return;
    if(begin('pointer',event.pointerId,event.clientX,event.clientY,target)){event.preventDefault();try{panel.setPointerCapture(event.pointerId);}catch{}}
  });
  panel.addEventListener('pointermove',e=>{if(gesture?.kind==='pointer'&&gesture.id===e.pointerId)move(e.clientX,e.clientY,e);});
  panel.addEventListener('pointerup',e=>{if(gesture?.kind==='pointer'&&gesture.id===e.pointerId)finish();});
  for(const name of ['pointercancel','lostpointercapture']) panel.addEventListener(name,e=>{if(gesture?.kind==='pointer'&&gesture.id===e.pointerId)finish(true);});
  panel.addEventListener('touchstart',e=>{if(e.touches.length!==1){finish(true);return;}const t=e.touches[0];begin('touch',t.identifier,t.clientX,t.clientY,e.target);},{passive:true});
  panel.addEventListener('touchmove',e=>{if(gesture?.kind!=='touch')return;if(e.touches.length!==1){finish(true);return;}const t=touchFor(e.touches,gesture.id);if(t)move(t.clientX,t.clientY,e);},{passive:false});
  panel.addEventListener('touchend',e=>{if(gesture?.kind!=='touch'||!touchFor(e.changedTouches,gesture.id))return;if(gesture.axis&&e.cancelable)e.preventDefault();finish();},{passive:false});
  panel.addEventListener('touchcancel',()=>finish(true),{passive:true});
  window.addEventListener('blur',()=>{if(gesture)finish(true);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(gesture)finish(true);if(closing)resetMotion();}});
  return {render,resetMotion,focus:()=>{body.scrollTop=0;next.focus({preventScroll:true});},get index(){return data?.index||0;},get directory(){return !!data?.directory;}};
}

const ZGT_WORDS={"close":"Закрыть обучение","pull":"Потяни вниз, чтобы закрыть","topics":"Темы","steps":"Шаги обучения","back":"Назад","next":"Дальше","example":"Пример","tap":"Тап по игровому полю","step":"Шаг","of":"из","done":"Понятно","directory":"Гиды по игре","directoryCopy":"Выбери нужную тему. Все примеры учебные: они не запускают покупки и не выдают награды.","empty":"Сейчас этот гид недоступен. Закрой окно и открой его снова.","allGuides":"Все игровые гиды","helpLabel":"Как работает этот раздел","finishMain":"В игру","finishStock":"Открыть склад","finishRating":"Открыть рейтинг","finishFriends":"Открыть подарки","profileXpText":"За зачтённый забег — +{run} XP, за подходящую успешную покупку — +{purchase} XP. Нажми на уровень или звание, чтобы открыть лестницу уровней и награды."};
const ZGT_PAGE_TOPIC={"id":"album","title":"Альбом Зеффи","summary":"Коллекции, обязательные предметы и этапы","icon":"/assets/ui/icon_albom.webp","steps":[{"title":"Каждый альбом — отдельная коллекция","text":"Открой обложку, чтобы увидеть предметы, прогресс и награды её этапов. В коллекции могут входить аватарки, рамки, следы, скины и музыка.","tip":"Показываются опубликованные коллекции. Пустой список не означает потерю твоих предметов.","scene":{"kind":"cards","title":"Истории в коллекциях","items":[{"title":"Обложка","subtitle":"Открыть историю","image":"/assets/ui/icon_albom.webp"},{"title":"Предметы","subtitle":"Посмотреть состав","image":"/assets/ui/icon_o_profile.webp"},{"title":"Этапы","subtitle":"Награды коллекции","image":"/assets/ui/icone_reward.webp"}]}},{"title":"Отличай обязательное от бонусного","text":"Предметы с отметкой «нужно» участвуют в обязательном прогрессе. Бонусные предметы дополняют коллекцию, а секретные могут быть скрыты до получения.","tip":"Фильтры меняют только список. Они не удаляют предметы и не пересчитывают владение на клиенте.","scene":{"kind":"cards","title":"Пример состава","items":[{"title":"Нужно","subtitle":"Обязательный предмет"},{"title":"Бонус","subtitle":"Дополнительный"},{"title":"???","subtitle":"Секретный"}]}},{"title":"За этапом следует выдача награды","text":"Когда условия этапа выполнены, используй его кнопку получения. Дождись смены статуса: доставка и уже полученная награда — разные состояния.","tip":"При ошибке доставки не создавай новые заявки наугад. Сверь состояние; при остановленной доставке обратись в поддержку.","scene":{"kind":"states","title":"Этап коллекции","items":[{"title":"Доступно","subtitle":"Можно запросить"},{"title":"В доставке","subtitle":"Ожидаем итог"},{"title":"Получено","subtitle":"Этап завершён"}]}}]};
const ZGT_HOST_BACK=["zefirok-album-back"];
// Standalone page adapter. Reads only its local guide catalogue, not player data.
const guideLayer = document.createElement('div');
guideLayer.className = 'zgt-layer'; guideLayer.hidden = true;
guideLayer.setAttribute('aria-hidden','true');
guideLayer.innerHTML = '<section class="zgt-dialog" role="dialog" aria-modal="true"><div class="zgt-mount"></div></section>';
document.body.appendChild(guideLayer);
let guideIndex = 0, guideLock = null, guideReturnFocus = null;
const pageGuide = createTutorialDeck(guideLayer, guideLayer.querySelector('.zgt-mount'), {
  onStep: value => {guideIndex=value; renderPageGuide();},
  onDismiss: closePageGuide, onFinish: closePageGuide
}, ZGT_WORDS);
function renderPageGuide() {pageGuide.render({...ZGT_PAGE_TOPIC,index:guideIndex,finishLabel:ZGT_WORDS.done});}
function openPageGuide() {
  if(!guideLayer.hidden) return;
  guideReturnFocus=document.activeElement;guideIndex=0;
  const body=document.body, root=document.documentElement;
  guideLock={y:window.scrollY,rootOverflow:root.style.overflow,bodyStyle:{position:body.style.position,top:body.style.top,left:body.style.left,right:body.style.right,width:body.style.width,overflow:body.style.overflow},inert:[]};
  for(const el of Array.from(body.children)) if(el!==guideLayer && !el.matches('script,style,link')) {guideLock.inert.push([el,el.hasAttribute('inert')]);el.setAttribute('inert','');}
  body.style.position='fixed';body.style.top=`-${guideLock.y}px`;body.style.left='0';body.style.right='0';body.style.width='100%';body.style.overflow='hidden';root.style.overflow='hidden';
  renderPageGuide();guideLayer.hidden=false;guideLayer.setAttribute('aria-hidden','false');pageGuide.focus();
}
function closePageGuide() {
  if(guideLayer.hidden) return false;
  pageGuide.resetMotion();guideLayer.hidden=true;guideLayer.setAttribute('aria-hidden','true');
  const lock=guideLock;guideLock=null;
  if(lock){Object.assign(document.body.style,lock.bodyStyle);document.documentElement.style.overflow=lock.rootOverflow;for(const [el,wasInert] of lock.inert)if(!wasInert)el.removeAttribute('inert');window.scrollTo(0,lock.y);}
  if(guideReturnFocus?.isConnected)guideReturnFocus.focus?.({preventScroll:true});
  return true;
}
window.ZefirokPageGuide={open:openPageGuide,closeIfOpen:closePageGuide,isOpen:()=>!guideLayer.hidden};
document.addEventListener('click',event=>{const t=event.target instanceof Element?event.target.closest('[data-zgt-help]'):null;if(!t)return;event.preventDefault();event.stopPropagation();openPageGuide();},true);
window.addEventListener('message',event=>{
  if(event.source!==window.parent && event.source!==window)return;
  if(!guideLayer.hidden && ZGT_HOST_BACK.includes(String(event.data?.type||''))){event.stopImmediatePropagation();closePageGuide();}
},true);

})();
