<style>
:root{--bg:#fff7f4;--card:#fff;--ink:#5c3948;--muted:#987986;--line:#efd6de;--pink:#d96f9b;--gold:#d8a13a;--app-h:100dvh;--safe-top:0px;--safe-bottom:0px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit}.app{height:var(--app-h);display:flex;flex-direction:column;overflow:hidden}.top{flex:0 0 auto;padding:calc(10px + var(--safe-top)) 12px 10px;background:rgba(255,249,247,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(228,194,205,.55);z-index:20}.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:8px}.reload{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:18px;font-weight:900}.bar h1{margin:0;padding-left:44px;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:13px 13px calc(26px + var(--safe-bottom))} .hero{position:relative;overflow:hidden;padding:20px;border:1px solid #f0ccd7;border-radius:28px;background:#fff7f4 url("/assets/ui/icon_background_albom.png") center/cover no-repeat;box-shadow:0 16px 36px rgba(103,57,74,.10)}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.16),rgba(255,255,255,.04));pointer-events:none}.hero>*{position:relative;z-index:1}.hero small{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.72);font-size:8px;font-weight:950;color:#ad5778;letter-spacing:.08em;text-transform:uppercase}.hero h2{margin:9px 0 5px;font-size:27px;line-height:1.05}.hero p{margin:0;max-width:420px;font-size:11px;line-height:1.5;color:var(--muted);font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}.metric{padding:10px;border:1px solid rgba(226,184,197,.62);border-radius:16px;background:rgba(255,255,255,.72)}.metric b{display:block;font-size:17px}.metric span{display:block;margin-top:3px;font-size:7px;color:var(--muted);font-weight:800}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 3px 9px}.section-head h3{margin:0;font-size:16px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:9px;line-height:1.4} .albums{display:grid;gap:11px}.album-card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:13px;min-height:166px;padding:17px;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:0 12px 28px rgba(97,58,71,.08);cursor:pointer}.album-cover{position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,.98) 4%,rgba(255,255,255,.86) 64%,rgba(255,255,255,.62)),linear-gradient(145deg,#ffe8f0,#fff2c8);background-position:center;background-size:cover}.album-body{position:relative;z-index:2;min-width:0;display:flex;flex-direction:column}.album-body h4{margin:0;font-size:19px;line-height:1.08}.album-body p{margin:5px 0 13px;color:var(--muted);font-size:9px;line-height:1.4}.progress-line{display:flex;align-items:center;gap:9px;margin-top:auto}.track{height:8px;flex:1;overflow:hidden;border-radius:999px;background:rgba(132,92,108,.12)}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent,#d96f9b),#e0ae42)}.progress-line b{font-size:11px}.album-foot{position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-top:12px}.album-side{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.album-art-shell{width:94px;height:94px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(226,188,199,.72);border-radius:20px;background:rgba(255,255,255,.84);box-shadow:0 8px 18px rgba(90,50,64,.09)}.album-art{width:84px;height:84px;object-fit:contain;display:block;filter:drop-shadow(0 6px 10px rgba(72,39,49,.12))}.pill{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px;border:1px solid #edcfda;border-radius:999px;background:#fff8fb;font-size:8px;font-weight:950;color:#96526c}.pill.done{border-color:#d8a63c;background:#fff4c7;color:#7f5710;box-shadow:0 3px 9px rgba(185,126,25,.13)}.open{width:94px;border:0;border-radius:13px;padding:9px 9px;background:linear-gradient(135deg,#dd739c,#c94e7c);color:#fff;font-size:9px;font-weight:950;box-shadow:0 7px 15px rgba(201,78,124,.18)} .detail{display:none}.detail.active{display:block}.landing.hidden{display:none}.detail-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:center;padding:18px;border:1px solid #efd1db;border-radius:28px;background:linear-gradient(145deg,#ffeaf1,#fff4d4);background-size:cover;background-position:center;box-shadow:0 14px 32px rgba(96,58,71,.09)}.detail-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(255,255,255,.96),rgba(255,255,255,.82) 67%,rgba(255,255,255,.62))}.detail-main{position:relative;z-index:2;min-width:0}.detail-cover-shell{position:relative;z-index:2;width:108px;height:108px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(225,186,198,.75);border-radius:22px;background:rgba(255,255,255,.86);box-shadow:0 9px 20px rgba(86,48,61,.10)}.detail-cover{width:98px;height:98px;object-fit:contain;display:block;filter:drop-shadow(0 6px 10px rgba(72,39,49,.12))}.detail-hero h2{margin:9px 0 5px;font-size:23px;line-height:1.08}.detail-hero p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.big-progress{margin-top:18px}.big-progress strong{display:flex;justify-content:space-between;gap:10px;font-size:10px}.big-progress .track{margin-top:7px;height:9px}.milestones{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,78%);gap:9px;overflow-x:auto;padding:2px 1px 8px;scroll-snap-type:x mandatory}.milestones::-webkit-scrollbar{display:none}.milestone{scroll-snap-align:start;padding:12px;border:1px solid var(--line);border-radius:20px;background:#fff;min-height:150px}.milestone.ready{border-color:#e0ba55;background:linear-gradient(145deg,#fff9df,#fff)}.milestone.claimed{border-color:#badfcf;background:#f4fcf8}.milestone-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.milestone-top b{font-size:15px;color:#a05c74}.milestone-top span{font-size:8px;font-weight:900;color:var(--muted)}.milestone h4{margin:8px 0 7px;font-size:11px}.reward{display:flex;align-items:center;gap:7px;padding:8px;border-radius:14px;background:#fff6dc}.reward img{width:34px;height:34px;object-fit:contain}.reward b{font-size:9px;line-height:1.25}.claim{width:100%;margin-top:8px;border:0;border-radius:12px;padding:9px;background:#d85f8c;color:#fff;font-size:9px;font-weight:950}.claim:disabled{opacity:.55}.filters{display:flex;gap:6px;overflow:auto;padding:2px 1px 8px}.filters::-webkit-scrollbar{display:none}.filters button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 10px;font-size:8px;font-weight:900}.filters button.active{border-color:transparent;background:#df739d;color:#fff}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{position:relative;min-width:0;padding:8px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center}.item.owned{border-color:#e0bb5a;background:linear-gradient(145deg,#fff9e6,#fff)}.item.secret{background:linear-gradient(145deg,#f6f0f2,#fff)}.item-art{height:82px;display:grid;place-items:center;border-radius:14px;background:#fff8f6;overflow:hidden}.item-art img{max-width:72px;max-height:72px;object-fit:contain}.secret-mark{font-size:31px;font-weight:1000;color:#c7aeb8}.item b{display:block;margin-top:7px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item span{display:block;margin-top:3px;color:var(--muted);font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.req{position:absolute;right:5px;top:5px;z-index:2;padding:3px 5px;border-radius:999px;background:#fff1c1;color:#956718;font-size:6px;font-weight:950} .check{position:absolute;left:7px;top:7px;z-index:3;width:23px;height:23px;display:grid;place-items:center;border:2px solid #fff7d2;border-radius:50%;background:linear-gradient(145deg,#ffd86a,#d99a22);color:#fff;font-size:13px;font-weight:1000;line-height:1;text-shadow:0 1px 1px rgba(112,69,5,.28);box-shadow:0 0 0 1px #c98d1d,0 5px 11px rgba(176,112,10,.30)} .empty,.error{padding:22px 14px;border:1px dashed #e2bdca;border-radius:20px;background:rgba(255,255,255,.65);text-align:center;color:var(--muted);font-size:10px;line-height:1.5}.error{border-style:solid;border-color:#efc1ca;background:#fff1f3;color:#a34456}.toast{position:fixed;left:50%;bottom:max(18px,var(--safe-bottom));z-index:80;width:min(380px,calc(100% - 26px));padding:11px 13px;border-radius:14px;background:#49313a;color:#fff;text-align:center;font-size:10px;font-weight:850;opacity:0;pointer-events:none;transform:translate(-50%,15px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:850}.spinner{width:31px;height:31px;margin:0 auto 9px;border:3px solid #f0d7df;border-top-color:#d96f9b;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:360px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.album-card{grid-template-columns:minmax(0,1fr) 88px;gap:10px;padding:14px}.album-art-shell,.open{width:82px}.album-art-shell{height:82px;border-radius:18px}.album-art{width:74px;height:74px}.album-body h4{font-size:17px}.detail-hero{grid-template-columns:minmax(0,1fr) 92px;gap:10px;padding:15px}.detail-cover-shell{width:88px;height:88px;border-radius:18px}.detail-cover{width:80px;height:80px}.detail-hero h2{font-size:20px}}

<body>
<div class="app"><header class="top"><div class="bar"><h1 id="pageTitle">Альбом Зеффи</h1><button class="reload" id="reload" type="button" aria-label="Обновить">↻</button></div></header><main class="main" id="main"><div class="loading"><div><div class="spinner"></div>Открываем Альбом…</div></div></main></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const tg=window.Telegram?.WebApp,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,currentId='',filter='all',busy=false,toastTimer=0;
try{tg?.ready?.();tg?.expand?.();tg?.disableVerticalSwipes?.();}catch{}try{window.parent.postMessage({type:'zefirok-request-fullscreen'},'*');}catch{}
function haptic(kind='light'){try{kind==='success'?tg?.HapticFeedback?.notificationOccurred?.('success'):tg?.HapticFeedback?.impactOccurred?.(kind);}catch{}}
function toast(text,error=false){const el=$('toast');el.textContent=text;el.style.background=error?'#9f4354':'#49313a';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function initData(){let value='';try{value=String(tg?.initData||'');}catch{}if(value)return value;try{const h=new URLSearchParams(location.hash.replace(/^#/,''));return String(h.get('tgInitData')||'');}catch{return '';}}
async function api(path,payload={}){const id=initData();if(!id)throw new Error('Telegram не передал данные входа. Откройте Альбом из игры.');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:id,...payload}),cache:'no-store',credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok||d?.ok===false)throw new Error(d?.error||`Ошибка ${r.status}`);return d;}
function plural(n,one,few,many){const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?many:y===1?one:y>=2&&y<=4?few:many;}
function kindLabel(k){return ({avatar:'Аватарка',frame:'Рамка',trail:'След',skin:'Скин',music:'Музыка'})[k]||k;}
function renderLanding(){currentId='';filter='all';$('pageTitle').textContent='Альбом Зеффи';const s=data?.summary||{},collections=data?.collections||[];$('main').innerHTML=`<div class="landing"><section class="hero"><small>Коллекции и воспоминания</small><h2>Альбом Зеффи</h2><p>Собирайте аватарки, рамки, следы, скины и музыку из приключений Зеффи. Каждый альбом — отдельная история.</p><div class="summary"><div class="metric"><b>${s.ownedRequired||0}/${s.requiredTotal||0}</b><span>обязательных предметов</span></div><div class="metric"><b>${s.progressPercent||0}%</b><span>общий прогресс</span></div><div class="metric"><b>${s.completedCollections||0}/${s.collections||0}</b><span>альбомов собрано</span></div></div></section><div class="section-head"><div><h3>Мои альбомы</h3><p>${collections.length?`${collections.length} ${plural(collections.length,'история','истории','историй')}`:'Опубликованных альбомов пока нет'}</p></div></div><div class="albums">${collections.length?collections.map(albumCard).join(''):'<div class="empty">Здесь появятся тематические коллекции после публикации в Control Center.</div>'}</div></div>`;document.querySelectorAll('[data-open-album]').forEach(b=>b.onclick=()=>openAlbum(b.dataset.openAlbum));}
function albumCard(a){const accent=esc(a.accentColor||'#d96f9b'),bg=a.backgroundUrl?`url(&quot;${esc(a.backgroundUrl)}&quot;)`:'';return `<article class="album-card" data-open-album="${esc(a.collectionId)}" style="--accent:${accent}"><div class="album-cover" style="${bg?`background-image:linear-gradient(110deg,rgba(255,255,255,.98) 4%,rgba(255,255,255,.88) 64%,rgba(255,255,255,.68)),${bg}`:''}"></div><div class="album-body"><h4>${esc(a.title)}</h4><p>${esc(a.subtitle||'Коллекция Зеффи')}</p><div class="progress-line"><div class="track"><i style="width:${Math.max(0,Math.min(100,a.progressPercent||0))}%"></i></div><b>${a.progressPercent||0}%</b></div><div class="album-foot"><span class="pill ${a.complete?'done':''}">${a.complete?'✓ СОБРАНО':`${a.ownedRequired}/${a.requiredTotal}`}</span></div></div><div class="album-side">${a.coverUrl?`<div class="album-art-shell"><img class="album-art" loading="lazy" src="${esc(a.coverUrl)}" alt=""></div>`:'<div class="album-art-shell" aria-hidden="true"></div>'}<button class="open" type="button">Открыть</button></div></article>`;}
function openAlbum(id){const a=data?.collections?.find(x=>x.collectionId===id);if(!a)return;currentId=id;filter='all';$('pageTitle').textContent=a.title;renderDetail(a);try{$('main').scrollTo({top:0,behavior:'instant'});}catch{$('main').scrollTop=0;}haptic();}
function rewardHtml(r){return `<div class="reward">${r.imageUrl?`<img loading="lazy" src="${esc(r.imageUrl)}" alt="">`:''}<b>${esc(r.title||'Награда')}</b></div>`;}
function milestoneHtml(m){const state=m.status||'locked',button=state==='claimed'?'<button class="claim" disabled>Получено</button>':state==='pending'?'<button class="claim" disabled>Получаем…</button>':state==='failed'?'<button class="claim" disabled>Ошибка доставки</button>':m.eligible?`<button class="claim" data-claim="${esc(m.milestoneId)}">Забрать</button>`:'<button class="claim" disabled>Закрыто</button>';return `<article class="milestone ${state==='claimed'?'claimed':m.eligible?'ready':''}"><div class="milestone-top"><b>${m.thresholdPercent}%</b><span>${state==='claimed'?'✓ Получено':state==='failed'?'Нужна проверка':m.eligible?'Доступно':'Ещё не открыто'}</span></div><h4>${esc(m.title||`${m.thresholdPercent}% коллекции`)}</h4>${(m.rewards||[]).map(rewardHtml).join('')}${button}</article>`;}
function renderDetail(a){const bg=a.backgroundUrl?`background-image:linear-gradient(95deg,rgba(255,255,255,.96),rgba(255,255,255,.84) 68%,rgba(255,255,255,.66)),url(&quot;${esc(a.backgroundUrl)}&quot;);`:'';$('main').innerHTML=`<div class="detail active" style="--accent:${esc(a.accentColor||'#d96f9b')}"><section class="detail-hero" style="${bg}"><div class="detail-main"><span class="pill ${a.complete?'done':''}">${a.complete?'✓ КОЛЛЕКЦИЯ СОБРАНА':'АЛЬБОМ ЗЕФФИ'}</span><h2>${esc(a.title)}</h2><p>${esc(a.subtitle||'Соберите все обязательные воспоминания этой истории.')}</p><div class="big-progress"><strong><span>${a.ownedRequired} из ${a.requiredTotal}</span><span>${a.progressPercent}%</span></strong><div class="track"><i style="width:${a.progressPercent}%"></i></div></div></div>${a.coverUrl?`<div class="detail-cover-shell"><img class="detail-cover" src="${esc(a.coverUrl)}" alt=""></div>`:'<div class="detail-cover-shell" aria-hidden="true"></div>'}</section>${a.milestones?.length?`<div class="section-head"><div><h3>Награды за коллекцию</h3><p>Этапы выдаются один раз</p></div></div><div class="milestones">${a.milestones.map(milestoneHtml).join('')}</div>`:''}<div class="section-head"><div><h3>Страницы коллекции</h3><p>${a.ownedTotal} из ${a.totalItems} предметов найдено</p></div></div><div class="filters">${[['all','Все'],['avatar','Аватарки'],['frame','Рамки'],['trail','Следы'],['skin','Скины'],['music','Музыка']].map(([k,t])=>`<button type="button" data-filter="${k}" class="${filter===k?'active':''}">${t}</button>`).join('')}</div><div class="items" id="items"></div></div>`;renderItems(a);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderItems(a);});document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(a,b.dataset.claim,b));}
function renderItems(a){const items=(a.items||[]).filter(x=>filter==='all'||x.kind===filter);$('items').innerHTML=items.length?items.map(item=>{if(item.secret&&!item.owned)return `<article class="item secret">${item.required?'<span class="req">нужно</span>':''}<div class="item-art"><div class="secret-mark">?</div></div><b>???</b><span>${esc(kindLabel(item.kind))} · секрет</span></article>`;return `<article class="item ${item.owned?'owned':''}">${item.required?'<span class="req">нужно</span>':''}${item.owned?'<span class="check">✓</span>':''}<div class="item-art">${item.imageUrl?`<img loading="lazy" src="${esc(item.imageUrl)}" alt="">`:'<div class="secret-mark">◇</div>'}</div><b>${esc(item.title||item.itemId||'Предмет')}</b><span>${esc(kindLabel(item.kind))} · ${esc(item.rarity||'common')}${item.required?'':' · бонус'}</span></article>`;}).join(''):'<div class="empty" style="grid-column:1/-1">В этой категории предметов нет.</div>';}
async function refreshClaimState(collectionId,milestoneId,attempt=0){if(attempt>2)return;window.setTimeout(async()=>{try{const fresh=await api('/api/album/state');data=fresh;const a=fresh.collections?.find(x=>x.collectionId===collectionId),m=a?.milestones?.find(x=>x.milestoneId===milestoneId);if(currentId===collectionId&&a)renderDetail(a);if(m?.status==='pending')refreshClaimState(collectionId,milestoneId,attempt+1);else if(m?.status==='claimed'){toast('Награда получена');try{window.parent.postMessage({type:'zefirok-album-account-updated',revision:Number(fresh.accountRevision||0)},'*');}catch{}}else if(m?.status==='failed')toast('Доставка награды остановлена. Нужна проверка в Control Center.',true);}catch{}},1200+attempt*900);}
async function claim(a,milestoneId,button){if(busy)return;busy=true;button.disabled=true;button.textContent='Получаем…';try{const requestId=`album-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`,result=await api('/api/album/claim',{collectionId:a.collectionId,milestoneId,requestId});data=result.state||await api('/api/album/state');const updated=data.collections.find(x=>x.collectionId===a.collectionId),updatedMilestone=updated?.milestones?.find(x=>x.milestoneId===milestoneId);renderDetail(updated||a);if(updatedMilestone?.status==='failed')toast('Доставка награды остановлена. Нужна проверка в Control Center.',true);else if(updatedMilestone?.status==='pending'){toast('Награда в доставке…');refreshClaimState(a.collectionId,milestoneId);}else{haptic('success');toast('Награда получена');}try{window.parent.postMessage({type:'zefirok-album-account-updated',revision:Number(data.accountRevision||0)},'*');}catch{}}catch(e){toast(e.message,true);button.disabled=false;button.textContent='Забрать';}finally{busy=false;}}
async function load(){if(busy)return;busy=true;try{data=await api('/api/album/state');if(currentId&&data.collections?.some(x=>x.collectionId===currentId))openAlbum(currentId);else renderLanding();}catch(e){$('main').innerHTML=`<div class="error"><b>Не удалось открыть Альбом</b><br><br>${esc(e.message)}</div>`;}finally{busy=false;}}
function close(){try{window.parent.postMessage({type:'zefirok-close-album'},'*');}catch{history.back();}}
function handleHostBack(){if(currentId){renderLanding();try{$('main').scrollTo({top:0,behavior:'instant'});}catch{$('main').scrollTop=0;}haptic();return;}close();}
$('reload').onclick=()=>load();window.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;if(m.type==='zefirok-album-back'){handleHostBack();return;}if(m.type==='zefirok-host-viewport-changed'){const p=m.payload||{};if(Number(p.height)>0)document.documentElement.style.setProperty('--app-h',`${Number(p.height)}px`);const safe=p.contentSafeArea||{};document.documentElement.style.setProperty('--safe-top',`${Number(safe.top||0)}px`);document.documentElement.style.setProperty('--safe-bottom',`${Number(safe.bottom||0)}px`);}});load();
})();
</script>
