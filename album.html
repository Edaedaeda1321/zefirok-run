async function api(path,payload={}){

 if(!id&&!test)throw new Error('Открой Альбом из игры в Telegram.');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  let body={initData:id,...payload};
  if(test){let session='';try{session=localStorage.getItem('zefirok-owner-session-v1')||'';}catch{}body={initData:id,ownerSession:session,path,method:'POST',query:{},payload:body};}
  const r=await fetch(test?'/api/owner/test-project/game':path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store',credentials:'same-origin',signal:controller.signal});
  const envelope=await r.json();
  if(test&&envelope?.proxyNetworkError)throw new Error(envelope.error||'Сервер временно недоступен.');
  if(!r.ok||envelope?.ok===false)throw Object.assign(new Error(envelope?.error||'Не удалось обновить Альбом.'),{status:r.status});
  const d=test?(envelope?.data||envelope):envelope;
  if(!d||d.ok===false)throw new Error(d?.error||'Не удалось обновить Альбом.');
  return d;
 }catch(e){if(e?.name==='AbortError')throw new Error('Сервер отвечает дольше обычного. Проверь состояние ещё раз.');throw e;}finally{clearTimeout(timer);}
}

 data=next;error='';
 for(const a of data.collections)for(const m of milestones(a))if(done(m)){requestIds.delete(key(a.collectionId,m.milestoneId));uncertain.delete(key(a.collectionId,m.milestoneId));}

// UI-only tutorial deck. No network calls, rewards, economy or save-state writes.
