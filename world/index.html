<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#fdf5f8" />
  <meta name="description" content="World Zeffi standalone city builder sandbox v0.1.13: animated construction acceleration and dynamic coffee-only prices" />
  <title>Мир Зеффи — Песочница 0.1.13</title>
  <link rel="stylesheet" href="./world.css" />
  <link rel="stylesheet" href="./premium-ui.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
 <div class="app-shell" id="app">
  <header class="topbar" aria-label="Панель Мира Зеффи">
   <div class="topbar-identity">
    <button type="button" class="back-button" id="zeffiReturnGame" aria-label="Вернуться в Сладкий Забег"><svg class="game-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="brand">
     <div class="brand-paw" aria-hidden="true"><svg viewBox="0 0 52 52" width="32" height="32" fill="none"><ellipse cx="26" cy="30" rx="13" ry="11" fill="#fff"/><circle cx="13" cy="19" r="5" fill="#fff"/><circle cx="23" cy="14" r="5" fill="#fff"/><circle cx="34" cy="16" r="5" fill="#fff"/><circle cx="42" cy="24" r="4" fill="#fff"/></svg></div>
     <div class="brand-text"><strong data-t="app"></strong><small data-t="subtitle"></small></div>
    </div>
   </div>
   <div class="topbar-side"><button class="icon-button help-button" id="helpButton" data-title="help" aria-label="Помощь" title="Помощь">?</button></div>
   <div class="test-wallet" aria-label="Валюты города">
    <span class="test-wallet__badge" data-t="demoWallet"></span>
    <span class="test-wallet__balance" title="Очки"><img src="../assets/optimized/v0.79.5/iconScore.webp" alt="" width="28" height="28" decoding="async"/><b id="walletPoints">0</b></span>
    <span class="test-wallet__balance" title="Кофе"><img src="../assets/optimized/v0.79.5/iconCoffee.webp" alt="" width="28" height="28" decoding="async"/><b id="walletCoffee">0</b></span>
    <span class="test-wallet__balance" title="Зефир"><img src="../assets/season-pass/zefir_currency.webp" alt="" width="28" height="28" decoding="async"/><b id="walletTreats">0</b></span>
    <button id="topupWallet" type="button" data-title="topUpWallet" aria-label="Пополнить тестовые валюты">+</button>
   </div>
  </header>
  <nav class="world-nav" aria-label="Выбор мира">
   <button type="button" class="world-nav__active" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8v9H3z"/><path d="M9 20v-8h6v8"/></svg><span data-t="myCity"></span></button>
   <button type="button" class="world-nav__disabled" id="commonButton"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-t="commonWorld"></span> <small data-t="commonLater"></small></button>
   <div class="nav-notice" title="Состояние синхронизации"><span class="notice-dot"></span><span id="saveStatus" data-t="local"></span><svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></div>
  </nav>
  <section class="map-zone" aria-label="City builder area" id="mapZone">
   <canvas id="worldCanvas" aria-label="Isometric construction map" tabindex="0"></canvas>
   <div class="map-glow" aria-hidden="true"></div>
   <div class="map-heading">
    <div class="map-title"><small>ZEFFI VALLEY</small><strong data-t="myCity"></strong></div>
    <div class="map-coordinates"><span class="coordinate-dot"></span><span id="coordLabel">24 x 24</span></div>
   </div>
   <div class="map-metrics" id="cityMetrics">
    <button type="button" class="metrics-toggle" id="metricsToggle" aria-controls="cityMetricsContent" aria-expanded="false" aria-label="Показать всю статистику города"><svg class="metrics-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> <span>Город в цифрах</span><span class="metrics-chevron">⌄</span></button>
    <div class="metrics-content" id="cityMetricsContent">
     <div class="metric metric-people"><svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-t="population"></span><strong id="populationCount">0</strong></div>
     <div class="metric metric-comfort" id="comfortCard"><svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.3 5.3 0 0 0-7.5 0L12 5.9l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.9a5.3 5.3 0 0 0 0-7.5z"/></svg><span data-t="comfort"></span><strong id="comfortCount">0</strong><small id="comfortTier" aria-live="polite"></small></div>
     <div class="metric metric-completed"><svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8v9H3z"/><path d="M9 20v-8h6v8"/></svg><span data-t="completedStructures"></span><strong id="buildingsCount">0</strong></div>
     <div class="metric metric-build"><svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-7 7a2 2 0 0 1-3-3l7-7"/><path d="m11 6 3-3 7 7-3 3"/><path d="M16 5 19 2"/></svg><span data-t="buildInProgress"></span><strong id="constructingCount">0</strong></div>
    </div>
   </div>
   <div class="world-tools" role="toolbar" aria-label="Инструменты города">
    <button id="openBuildCatalog" type="button" class="tool-button tool-build" aria-controls="bottomPanel" aria-expanded="true"><svg class="tool-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-7 7a2 2 0 0 1-3-3l7-7"/><path d="m11 6 3-3 7 7-3 3"/><path d="M16 5 19 2"/></svg><small>Строить</small></button>
    <button id="toolSelect" data-tool="select" type="button" class="tool-button is-active" aria-label="Режим просмотра" title="Режим просмотра"><svg class="tool-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-7 1-3 7z"/><path d="m12 13 5 7"/></svg><small>Выбор</small></button>
    <button id="toolRoad" data-tool="road" type="button" class="tool-button" aria-label="Строить дороги" title="Строить дороги"><svg class="tool-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4M9 21l12-12M4 15l11-11"/><path d="m9 15 2-2m2-2 2-2"/></svg><small>Дороги</small></button>
    <button id="toolErase" data-tool="erase" type="button" class="tool-button" aria-label="Удалить дорогу" title="Удалить дорогу"><svg class="tool-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 9-10 8 8-6 7H9z"/><path d="m13 6 8 8M8 21h13"/></svg><small>Убрать</small></button>
    <button id="toolExpand" data-tool="expand" type="button" class="tool-button tool-expand" aria-label="Купить землю" title="Купить землю"><svg class="tool-glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/><path d="m16 8 2-2m-2 0 2 2"/></svg><small>Земля</small></button>
   </div>
   <div class="zoom-tools" aria-label="Camera controls">
    <button class="small-round" id="zoomIn" type="button" data-title="zoomIn" title="Zoom in">+</button>
    <button class="small-round" id="zoomOut" type="button" data-title="zoomOut" title="Zoom out">-</button>
    <button class="small-round camera-round" id="centerCamera" type="button" data-title="camera" title="Center camera">&#x2316;</button>
   </div>
   <div class="floating-notice" id="mapNotice"><span class="notice-star" aria-hidden="true">&#x2727;</span><span id="mapHint" data-t="hintSelect"></span></div>
   <div class="edit-actions" id="editActions" hidden>
    <div class="edit-summary"><small id="previewKind" data-t="preview"></small><b id="editSummary"></b><span id="editFeedback"></span></div>
    <div class="edit-buttons">
     <button class="ghost-button" id="rotateButton" type="button"><span class="btn-sign">&#x21bb;</span><span data-t="rotate"></span></button>
     <button class="ghost-button" id="cancelEdit" type="button" data-t="cancel"></button>
     <button class="solid-button" id="confirmEdit" type="button" data-t="confirm"></button>
    </div>
   </div>
   <div class="selection-panel" id="selectionPanel" hidden>
    <div class="selection-meta"><div class="selection-emblem" id="selectionEmblem">&#x2302;</div><div><small data-t="details"></small><strong id="selectionName"></strong><span id="selectionStatus"></span></div></div>
    <div class="selection-actions"><button id="moveSelected" type="button" data-t="moveItem"></button><button id="storeSelected" type="button" data-t="sendToStore"></button><button id="finishBuildTest" type="button" hidden></button><button id="closeSelected" type="button" aria-label="Close">&#x2715;</button></div>
   </div>
   <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
  <section class="bottom-panel is-open" id="bottomPanel" aria-label="Строительство">
   <div class="sheet-grip" aria-hidden="true"></div>
   <div class="panel-head">
    <div class="panel-heading"><div class="panel-heading-icon"><svg class="panel-shop-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 2-5h14l2 5-2 2H5z"/><path d="M5 11v9h14v-9M9 20v-6h6v6"/></svg></div><div class="panel-heading-label"><h2 id="panelTitle" data-t="chooseCategory"></h2><span class="panel-subtitle">Построй свой уютный городок</span></div></div>
    <div class="panel-head-actions">
     <button class="head-action" id="warehouseButton" type="button" aria-label="Склад построек" title="Склад построек"><svg class="panel-action-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V8l9-5 9 5v12H3z"/><path d="M9 20v-8h6v8M3 9l9 4 9-4"/></svg><b id="warehouseBadge">0</b></button>
     <button class="head-action" id="undoButton" type="button" data-title="undo" aria-label="Отменить">↶</button>
     <button class="head-action" id="redoButton" type="button" data-title="redo" aria-label="Повторить">↷</button>
     <button class="head-action catalog-toggle" id="catalogToggle" type="button" aria-label="Свернуть каталог" aria-controls="bottomPanel" aria-expanded="true"><svg class="panel-action-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
   </div>
   <div class="category-tabs" id="categoryTabs" aria-label="Категории построек"></div>
   <div class="catalog-list" id="catalogList"></div>
   <div class="warehouse-list" id="warehouseList" hidden></div>
   <div class="panel-footer"><span class="safe-marker"></span><span data-t="noMoney"></span><button type="button" id="resetButton" data-t="reset"></button></div>
  </section>
  <div class="modal-backdrop" id="welcomeModal" hidden><div class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcome-crest"><svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="29" fill="#fff1f6"/><circle cx="32" cy="35" r="15" fill="#edb5c9"/><circle cx="19" cy="20" r="5" fill="#edb5c9"/><circle cx="30" cy="15" r="5" fill="#edb5c9"/><circle cx="42" cy="18" r="5" fill="#edb5c9"/><circle cx="51" cy="28" r="4" fill="#edb5c9"/></svg></div><small data-t="v01"></small><h2 id="welcomeTitle" data-t="welcomeTitle"></h2><p data-t="welcomeText"></p><div class="welcome-features" data-t="welcomePoints"></div><button class="solid-button" id="welcomeStart" data-t="welcomeGo" type="button"></button></div></div>
  <div class="modal-backdrop" id="confirmModal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle" data-t="modalResetTitle"></h2><p data-t="modalResetBody"></p><div class="modal-actions"><button id="resetCancel" class="ghost-button" type="button" data-t="modalCancel"></button><button id="resetAccept" class="solid-button" type="button" data-t="resetConfirm"></button></div></div></div>
  <div class="modal-backdrop" id="skipModal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="skipTitle"><h2 id="skipTitle" data-t="skipConfirmTitle"></h2><p id="skipConfirmText"></p><p class="modal-balance" id="skipWalletHint"></p><div class="modal-actions"><button id="skipCancel" class="ghost-button" type="button" data-t="modalCancel"></button><button id="skipAccept" class="solid-button" type="button" data-t="skipConfirmPay"></button></div></div></div>
  <div class="modal-backdrop" id="helpModal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle" data-t="help"></h2><p data-t="helpShort"></p><p data-t="helpBuild"></p><p data-t="helpRoad"></p><p data-t="helpWarehouse"></p><p data-t="helpExpand"></p><p data-t="constructionInfo"></p><div class="tip-card" data-t="phaseInfo"></div><button class="solid-button" id="helpClose" type="button" data-t="confirm"></button></div></div>
 </div>
</body>
</html>
