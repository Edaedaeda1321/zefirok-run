<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Сканер наград</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#573b45;background:#fff6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#ffdce8 0,transparent 45%),linear-gradient(180deg,#fffafd,#fff1f5);padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.app{max-width:440px;margin:0 auto}.head{text-align:center;margin:6px 0 16px}.head .icon{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:21px;background:linear-gradient(145deg,#f7a9c4,#e978a1);box-shadow:0 12px 28px rgba(194,74,116,.22);font-size:30px}.head h1{margin:12px 0 5px;font-size:24px}.head p{margin:0;color:#92727e;font-size:14px;line-height:1.4}.card{padding:16px;border:1px solid rgba(207,139,161,.32);border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 15px 42px rgba(98,51,67,.1);backdrop-filter:blur(10px)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:49px;border:0;border-radius:16px;padding:11px 13px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#ef8fb1,#df628f);color:white;box-shadow:0 8px 20px rgba(205,81,125,.22)}.btn.secondary{background:#f7edf1;color:#805666}.btn:disabled{opacity:.48;cursor:default}.manual{display:flex;gap:8px;margin-top:10px}.manual input{min-width:0;flex:1;border:1px solid #e6c9d3;border-radius:15px;background:#fff;padding:13px;color:#5c3c47;font:700 15px ui-monospace,monospace;text-transform:uppercase}.status{margin-top:12px;padding:12px;border-radius:16px;background:#fff5e9;color:#8b6440;font-size:13px;line-height:1.4}.status.ok{background:#edf9f1;color:#397452}.status.bad{background:#fff0f0;color:#a44f4f}.result{display:none;margin-top:13px;padding:15px;border:1px solid #ead3db;border-radius:19px;background:#fff}.result.show{display:block}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eaf8ef;color:#3e7756;font-size:11px;font-weight:900}.badge.used,.badge.expired,.badge.cancelled{background:#f3ecef;color:#8a6f79}.result h2{margin:10px 0 8px;font-size:21px}.meta{display:grid;gap:7px;margin:12px 0 15px;padding:12px;border-radius:15px;background:#fff5f8;font-size:13px}.meta div{display:flex;justify-content:space-between;gap:10px}.meta span{color:#9b7b87}.meta strong{text-align:right;overflow-wrap:anywhere}.footer{margin:14px 4px 0;color:#9e7d89;text-align:center;font-size:11px;line-height:1.4}
</style>
</head>
<body>
<main class="app">
  <header class="head"><div class="icon">📷</div><h1>Сканер наград</h1><p>Наведите камеру на QR игрока или введите код вручную.</p></header>
  <section class="card">
    <div class="actions"><button class="btn primary" id="scan">Сканировать QR</button><button class="btn secondary" id="reset">Очистить</button></div>
    <div class="manual"><input id="manual" autocomplete="off" inputmode="text" placeholder="Код награды"><button class="btn secondary" id="lookup">Проверить</button></div>
    <div class="status" id="status">Сканер готов. Для работы нужна активная сессия сотрудника.</div>
    <div class="result" id="result">
      <span class="badge" id="badge">Активен</span>
      <h2 id="product">Награда</h2>
      <div class="meta">
        <div><span>Игрок</span><strong id="owner">—</strong></div>
        <div><span>Код</span><strong id="code">—</strong></div>
        <div><span>Действует до</span><strong id="expires">—</strong></div>
      </div>
      <button class="btn primary" id="redeem" style="width:100%">Подарок выдан — списать</button>
    </div>
  </section>
  <p class="footer">QR содержит только одноразовый код. Данные игрока и награды загружаются с сервера после проверки.</p>
</main>
<script>
(function(){
  var tg=window.Telegram&&window.Telegram.WebApp,current=null,confirmUntil=0,scanHandled=false;
  var el=function(id){return document.getElementById(id)},status=el('status'),result=el('result'),redeem=el('redeem'),manual=el('manual');
  if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#fff6f8');tg.setBackgroundColor('#fff6f8')}catch(e){}}
  function setStatus(text,type){status.textContent=text;status.className='status'+(type?' '+type:'')}
  function formatDate(sec){if(!sec)return '—';return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(sec*1000))}
  function showReward(r){current=r;result.classList.add('show');el('product').textContent=r.productName||'Физическая награда';el('owner').textContent=(r.ownerName||'Гость')+(r.ownerTelegramId?' · '+r.ownerTelegramId:'');el('code').textContent=r.code||'—';el('expires').textContent=formatDate(r.expiresAt);var labels={active:'Активен',used:'Уже списан',expired:'Срок истёк',cancelled:'Отменён'};el('badge').textContent=labels[r.status]||r.status;el('badge').className='badge '+(r.status||'');redeem.disabled=r.status!=='active';redeem.textContent=r.status==='active'?'Подарок выдан — списать':labels[r.status]||'Недоступно';confirmUntil=0}
  async function api(path,payload){var response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:tg&&tg.initData||''},payload)),cache:'no-store',credentials:'same-origin'});var data=await response.json().catch(function(){return null});if(!response.ok||!data||!data.ok)throw new Error(data&&data.error||'Сервис временно недоступен.');return data}
  async function lookup(value){var raw=String(value||'').trim();if(!raw){setStatus('Введите код или отсканируйте QR.','bad');return}setStatus('Проверяем код…');result.classList.remove('show');try{var data=await api('/api/staff/rewards/lookup',{code:raw});showReward(data.reward);setStatus(data.reward.status==='active'?'Код действителен. Перед списанием передайте подарок игроку.':'Код найден, но уже недоступен.',data.reward.status==='active'?'ok':'bad');try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(data.reward.status==='active'?'success':'warning')}catch(e){}}catch(e){current=null;setStatus(e.message||String(e),'bad');try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('error')}catch(x){}}}
  function acceptScan(value){if(scanHandled)return true;scanHandled=true;try{tg&&tg.closeScanQrPopup&&tg.closeScanQrPopup()}catch(e){}lookup(value);return true}
  function scan(){if(!tg||typeof tg.showScanQrPopup!=='function'){setStatus('В этой версии Telegram встроенный сканер недоступен. Используйте ручной ввод.','bad');return}scanHandled=false;setStatus('Наведите камеру на QR-код игрока.');try{tg.showScanQrPopup({text:'Наведите камеру на QR награды'},function(text){return acceptScan(text)})}catch(e){setStatus('Не удалось открыть камеру. Проверьте разрешение или введите код вручную.','bad')}}
  if(tg&&tg.onEvent)tg.onEvent('qrTextReceived',function(event){acceptScan(event&&event.data||event||'')});
  el('scan').addEventListener('click',scan);el('lookup').addEventListener('click',function(){lookup(manual.value)});manual.addEventListener('keydown',function(e){if(e.key==='Enter')lookup(manual.value)});el('reset').addEventListener('click',function(){current=null;manual.value='';result.classList.remove('show');confirmUntil=0;setStatus('Сканер готов.','')});
  redeem.addEventListener('click',async function(){if(!current||current.status!=='active')return;var now=Date.now();if(now>confirmUntil){confirmUntil=now+4500;redeem.textContent='Нажмите ещё раз для списания';setStatus('Проверьте, что подарок уже передан игроку, и подтвердите ещё раз.');return}redeem.disabled=true;setStatus('Списываем награду…');try{var data=await api('/api/staff/rewards/redeem',{code:current.code});showReward(data.reward);setStatus('Готово. Награда выдана и код списан.','ok');try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}}catch(e){redeem.disabled=false;redeem.textContent='Подарок выдан — списать';confirmUntil=0;setStatus(e.message||String(e),'bad')}});
})();
</script>
</body>
</html>
