<meta content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com https://telegram.org; style-src 'unsafe-inline' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; img-src 'self' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; font-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; media-src 'self' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; worker-src blob:; connect-src 'self' blob: data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" http-equiv="Content-Security-Policy"/>
<title>Сладкий Забег</title>
<style>:root{color-scheme:light dark;background:light-dark(rgb(255 255 255), rgb(24 24 24))}html,body{margin:0}body{box-sizing:border-box;padding:1rem;background:inherit}iframe{display:block;width:100%;max-width:736px;height:calc(100vh - 2rem);margin:0 auto;border:0}</style>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script>
(() => {
  const CLOUD_KEY = "zefirok_runner_progress_v2";
  const LOCAL_KEY = "zefirok-runner-progress-v2";
  const LEGACY_LOCAL_KEY = "zefirok-runner-progress-v1";
  let latestSerialized = "";
  let saveTimer = 0;

  const frame = () => document.querySelector("iframe");

  function parseProgress(raw) {
    if (!raw || typeof raw !== "string") return null;
    try {
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? parsed : null;
    } catch (error) {
      return null;
    }
  }

  function readLocal() {
    try {
      return parseProgress(localStorage.getItem(LOCAL_KEY) || localStorage.getItem(LEGACY_LOCAL_KEY));
    } catch (error) {
      return null;
    }
  }

  function writeLocal(serialized) {
    try {
      localStorage.setItem(LOCAL_KEY, serialized);
      localStorage.removeItem(LEGACY_LOCAL_KEY);
    } catch (error) {
      // localStorage can be unavailable in restrictive browser modes.
    }
  }

  function cloudStorage() {
    return window.Telegram?.WebApp?.CloudStorage || null;
  }

  function readCloud() {
    const cloud = cloudStorage();
    if (!cloud) return Promise.resolve(null);
    return new Promise((resolve) => {
      try {
        cloud.getItem(CLOUD_KEY, (error, value) => {
          resolve(error ? null : parseProgress(value));
        });
      } catch (error) {
        resolve(null);
      }
    });
  }

  function writeCloud(serialized) {
    const cloud = cloudStorage();
    if (!cloud || serialized.length > 4096) return Promise.resolve(false);
    return new Promise((resolve) => {
      try {
        cloud.setItem(CLOUD_KEY, serialized, (error, stored) => {
          resolve(!error && stored !== false);
        });
      } catch (error) {
        resolve(false);
      }
    });
  }

  function progressTime(progress) {
    return Number(progress?.updatedAt) || 0;
  }

  function chooseNewest(localProgress, cloudProgress) {
    if (!localProgress) return cloudProgress;
    if (!cloudProgress) return localProgress;
    return progressTime(cloudProgress) > progressTime(localProgress) ? cloudProgress : localProgress;
  }

  async function sendSavedProgress(targetWindow) {
    const localProgress = readLocal();
    const cloudProgress = await readCloud();
    const selected = chooseNewest(localProgress, cloudProgress);
    if (!selected || !targetWindow) return;
    const serialized = JSON.stringify(selected);
    latestSerialized = serialized;
    writeLocal(serialized);
    if (!cloudProgress || progressTime(selected) > progressTime(cloudProgress)) {
      void writeCloud(serialized);
    }
    targetWindow.postMessage({ type: "zefirok-progress-data", payload: selected }, "*");
  }

  function storeProgress(payload) {
    if (!payload || typeof payload !== "object") return;
    const serialized = JSON.stringify(payload);
    if (!serialized || serialized.length > 4096 || serialized === latestSerialized) return;
    latestSerialized = serialized;
    writeLocal(serialized);
    clearTimeout(saveTimer);
    saveTimer = window.setTimeout(() => void writeCloud(serialized), 120);
  }

  function buildTelegramProfile() {
    try {
      const user = window.Telegram?.WebApp?.initDataUnsafe?.user;
      if (!user || user.id == null) {
        return { available: false };
      }
      return {
        available: true,
        id: String(user.id),
        firstName: String(user.first_name || ""),
        lastName: String(user.last_name || ""),
        username: String(user.username || ""),
        photoUrl: String(user.photo_url || ""),
        languageCode: String(user.language_code || ""),
        isPremium: Boolean(user.is_premium),
        initData: String(window.Telegram?.WebApp?.initData || "")
      };
    } catch (error) {
      return { available: false };
    }
  }

  function sendTelegramProfile(targetWindow) {
    if (!targetWindow) return;
    targetWindow.postMessage({
      type: "zefirok-telegram-profile-data",
      payload: buildTelegramProfile()
    }, "*");
  }

  window.addEventListener("message", (event) => {
    const gameFrame = frame();
    if (gameFrame && event.source !== gameFrame.contentWindow) return;
    const message = event.data;
    if (!message || typeof message !== "object") return;
    if (message.type === "zefirok-progress-ready") {
      void sendSavedProgress(event.source);
      sendTelegramProfile(event.source);
    } else if (message.type === "zefirok-telegram-profile-ready") {
      sendTelegramProfile(event.source);
    } else if (message.type === "zefirok-progress-save") {
      storeProgress(message.payload);
    } else if (message.type === "zefirok-open-telegram") {
      const username = String(message.username || "").trim().replace(/^@/, "");
      if (!username) return;
      const start = String(message.start || "").trim().replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64);
      const url = start
        ? `https://t.me/${encodeURIComponent(username)}?start=${encodeURIComponent(start)}`
        : `https://t.me/${encodeURIComponent(username)}`;
      try {
        if (window.Telegram?.WebApp?.openTelegramLink) {
          window.Telegram.WebApp.openTelegramLink(url);
          return;
        }
      } catch (error) {
        // Fall back to normal navigation outside Telegram.
      }
      window.location.href = url;
    }
  });

  try {
    window.Telegram?.WebApp?.ready();
  } catch (error) {
    // Normal browser preview: localStorage fallback will be used.
  }
})();
</script>
</head>
<body>
<iframe allow="clipboard-write" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin" src="game.html?v=5.0.1-ui-hotfix-1"></iframe>
</body>
